---
# The server restarts the engine pod after installing custom nodes: pods get/list/delete in this namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aerisstudio
  namespace: "{{ .Release.Namespace }}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aerisstudio-engine-restart
  namespace: "{{ .Release.Namespace }}"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aerisstudio-engine-restart
  namespace: "{{ .Release.Namespace }}"
subjects:
  - kind: ServiceAccount
    name: aerisstudio
    namespace: "{{ .Release.Namespace }}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aerisstudio-engine-restart
