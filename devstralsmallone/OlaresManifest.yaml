---
olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  devstralsmallone: 1

metadata:
  name: devstralsmallone
  icon: https://orales-one-market.aamsellem.workers.dev/icons/devstralsmallone.png
  description: "Devstral Small 2507 via llama.cpp — coding agent optimized for Olares One"
  appid: devstralsmallone
  title: Devstral Small Code One
  version: '1.1.1'
  categories:
    - Coding
    - AI Agents
entrances:
  - name: devstralsmallone
    port: 8080
    host: devstralsmallone
    title: Devstral Code One
    icon: https://orales-one-market.aamsellem.workers.dev/icons/devstralsmallone.png
    openMethod: window
    authLevel: internal
spec:
  versionName: '1.1.1'
  upgradeDescription: |
    v1.1.1: **Olares 1.12.6+ compatibility: manifest migrated to apiVersion v3.** Olares 1.12.6 deprecated apiVersion v2 apps: installed v2 versions keep running but can no longer be upgraded ("This app version has been deprecated and cannot be upgraded") or installed. If you run a previous version, **uninstall it and install 1.1.1**; model files in the shared model folder are kept. No change to the inference stack. Requires Olares >= 1.12.6.

  fullDescription: |
    Devstral Small 2507 (24B dense) served via llama.cpp — coding agent optimized for Olares One.
    #1 open-source on SWE-Bench Verified (53.6%) — outperforms models 10x larger.
    RTX 5090M (24GB) + 96GB DDR5 + Core Ultra 9 275HX.
    Unsloth Dynamic Q5_K_XL quantization (16.8GB) — room for 32K+ context.
    Based on Mistral-Small-3.1, fine-tuned for agentic software engineering.
    Tool calling support with Mistral format.
    llama.cpp b8334 with flash attention and CUDA graph optimization.
    Downloads the GGUF model on first launch (~17GB) and caches it.
    Exposes an OpenAI-compatible API on port 8080.

  developer: aamsellem
  website: https://github.com/aamsellem/olares-one-market
  sourceCode: https://github.com/aamsellem/olares-one-market
  submitter: aamsellem
  locale:
    - en-US
  license:
    - text: Apache-2.0
      url: https://huggingface.co/mistralai/Devstral-Small-2507/blob/main/LICENSE


  supportArch:
    - amd64
  accelerator:
    - mode: nvidia
      supportMultiCard: false
      supportMultiNodes: false
      requiredCpu: "4"
      limitedCpu: "16"
      requiredMemory: 24Gi
      limitedMemory: 40Gi
      requiredDisk: 30Gi
      limitedDisk: 50Gi
      requiredGPUMemory: 23Gi
      limitedGPUMemory: 23Gi
permission:
  appData: true
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
