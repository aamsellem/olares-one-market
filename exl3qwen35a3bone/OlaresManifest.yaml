---
olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  exl3qwen35a3bone: 1

metadata:
  name: exl3qwen35a3bone
  icon: https://orales-one-market.aamsellem.workers.dev/icons/llamacppqwen35a3bone.png
  description: "Qwen3.5 35B-A3B EXL3 4bpw via TabbyAPI + ExLlamaV3 — optimized for Olares One"
  appid: exl3qwen35a3bone
  title: Qwen3.5 35B EXL3 One
  version: '1.1.1'
  categories:
    - LLM Chat
entrances:
  - name: exl3qwen35a3bone
    port: 8080
    host: exl3qwen35a3bone
    title: Qwen 35B EXL3 One
    icon: https://orales-one-market.aamsellem.workers.dev/icons/llamacppqwen35a3bone.png
    openMethod: window
    authLevel: internal
spec:
  versionName: '1.1.1'
  upgradeDescription: |
    v1.1.1: **Olares 1.12.6+ compatibility: manifest migrated to apiVersion v3.** Olares 1.12.6 deprecated apiVersion v2 apps: installed v2 versions keep running but can no longer be upgraded ("This app version has been deprecated and cannot be upgraded") or installed. If you run a previous version, **uninstall it and install 1.1.1**; model files in the shared model folder are kept. No change to the inference stack. Requires Olares >= 1.12.6.

  fullDescription: |
    Qwen3.5 35B-A3B (MoE, 3B active) served via TabbyAPI + ExLlamaV3 — optimized for Olares One.
    RTX 5090M (24GB) + 96GB DDR5 + Core Ultra 9 275HX.
    EXL3 4.09bpw quantization by turboderp (18.24GB model, ~5.7GB free for KV cache).
    ExLlamaV3 custom Marlin-inspired GEMM kernels, native sm_120 Blackwell support.
    Downloads the EXL3 model on first launch (~18GB) and caches it.
    Exposes an OpenAI-compatible API (v1/chat/completions).

  developer: aamsellem
  website: https://github.com/aamsellem/olares-one-market
  sourceCode: https://github.com/aamsellem/olares-one-market
  submitter: aamsellem
  locale:
    - en-US
  license:
    - text: MIT
      url: https://github.com/turboderp-org/exllamav3/blob/master/LICENSE


  supportArch:
    - amd64
  accelerator:
    - mode: nvidia
      supportMultiCard: false
      supportMultiNodes: false
      requiredCpu: "4"
      limitedCpu: "16"
      requiredMemory: 24Gi
      limitedMemory: 40Gi
      requiredDisk: 30Gi
      limitedDisk: 50Gi
      requiredGPUMemory: 23Gi
      limitedGPUMemory: 23Gi
envs:
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
permission:
  appData: true
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
