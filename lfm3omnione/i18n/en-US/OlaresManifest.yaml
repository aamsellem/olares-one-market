metadata:
  description: "Liquid AI LFM3 Omni 2B: hears, sees, reads and talks back. Voice chat, transcription, speech, image and video, 305 t/s on Olares One."
  title: LFM3 Omni One
spec:
  fullDescription: |
    **LFM3 Omni 2B** is Liquid AI's small omni model: it understands text, images, video and speech, and answers in text or out loud. It runs entirely on the Olares One.

    **Measured on the Olares One** (RTX 5090 Laptop GPU, llama.cpp b12352): 305 t/s text generation, an image question answered in 1.2 s, a 5 s sentence transcribed in 0.1 s, a 4.6 s spoken sentence generated in 0.45 s.

    **What you get**: the llama.cpp web chat at this app's address, and an OpenAI-compatible API inside the cluster at `http://lfm3omnione:8080` (`/v1/chat/completions` with image and audio parts, `/v1/audio/transcriptions`, `/v1/audio/speech`, and the `/v1/realtime` WebSocket for voice conversations with tool calls).

    **Limits**: 32K tokens of context; a 2B model for voice front-ends, transcription and quick questions, not long reasoning or coding.

    **License**: LFM Open License v1.0, free under 10 million USD of annual revenue.
  upgradeDescription: |
    v1.0.0: first release. LFM3-Omni-2B Q8_0 with its F16 projector on llama.cpp b12352: 305 t/s, image in 1.2 s, transcription in 0.1 s, speech in 0.45 s.
