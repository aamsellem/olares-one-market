---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llamacpp-codernext40b-env
  namespace: "{{ .Release.Namespace }}"
data:
  TARGET_MODEL: "mradermacher/Qwen3-Coder-Next-REAP-40B-A3B-GGUF"
  TARGET_FILE: "Qwen3-Coder-Next-REAP-40B-A3B.Q3_K_M.gguf"
  MODEL_ALIAS: "qwen3-coder-next-reap-40b-a3b"
  THREADS: "16"
  CTX_SIZE: "262144"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: llamacppcodernext40bone
  name: llamacppcodernext40bone
  namespace: "{{ .Release.Namespace }}"
  annotations:
    applications.app.bytetrade.io/gpu-inject: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: llamacppcodernext40bone
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: llamacppcodernext40bone
    spec:
      containers:
        - name: llamacpp-server
          image: "ghcr.io/ggml-org/llama.cpp:server-cuda13-b8740"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              MODELS_DIR=${MODELS_DIR:-/models}
              SHARED_DIR=${SHARED_DIR:-/shared-models/llms}
              mkdir -p "$MODELS_DIR" "$SHARED_DIR"
              HF_AUTH=""
              if [ -n "$HF_TOKEN" ]; then HF_AUTH="-H \"Authorization: Bearer $HF_TOKEN\""; fi
              # Migrate $TARGET_FILE from old per-app dir to shared if needed
              if [ -f "$MODELS_DIR/$TARGET_FILE" ] && [ ! -f "$SHARED_DIR/$TARGET_FILE.ok" ]; then
                echo "==> Migrating $TARGET_FILE from per-app → shared"
                mv "$MODELS_DIR/$TARGET_FILE" "$SHARED_DIR/$TARGET_FILE"
                [ -f "$MODELS_DIR/$TARGET_FILE.ok" ] && mv "$MODELS_DIR/$TARGET_FILE.ok" "$SHARED_DIR/$TARGET_FILE.ok" || touch "$SHARED_DIR/$TARGET_FILE.ok"
              fi
              if [ ! -f "$SHARED_DIR/$TARGET_FILE.ok" ]; then
                echo "==> Downloading $TARGET_MODEL/$TARGET_FILE (~20 GB)"
                eval curl -fL -C - --retry 20 --retry-delay 15 --retry-all-errors --connect-timeout 30 $HF_AUTH \
                  "https://huggingface.co/${TARGET_MODEL}/resolve/main/${TARGET_FILE}" \
                  -o "$SHARED_DIR/$TARGET_FILE"
                touch "$SHARED_DIR/$TARGET_FILE.ok"
              fi
              exec /app/llama-server \
                --model "$SHARED_DIR/$TARGET_FILE" \
                --alias "$MODEL_ALIAS" \
                --host 0.0.0.0 --port 8000 \
                --n-gpu-layers 99 \
                --threads "${THREADS:-16}" \
                --ctx-size "${CTX_SIZE:-262144}" \
                --cache-type-k q8_0 --cache-type-v q8_0 \
                --batch-size 512 --ubatch-size 512 \
                --parallel 1 \
                --mlock \
                --swa-full \
                --flash-attn auto \
                --op-offload \
                --jinja
          envFrom:
            - configMapRef:
                name: llamacpp-codernext40b-env
          env:
            - name: HF_HOME
              value: "/models/huggingface"
            - name: HF_TOKEN
              value: "{{ .Values.olaresEnv.OLARES_USER_HUGGINGFACE_TOKEN }}"
            - name: MODELS_DIR
              value: "/models"
            - name: GGML_CUDA_GRAPH_OPT
              value: "1"
            - name: CUDA_DEVICE_MEMORY_LIMIT_0
              value: "30000m"
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 600
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 720
          resources:
            limits:
              cpu: "16"
              memory: 40Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: 4000m
              memory: 24Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - mountPath: "/models"
              name: models
            - mountPath: "/shared-models"
              name: shared-models
      volumes:
        - name: models
          hostPath:
            path: "{{ .Values.userspace.appData }}/models"
            type: DirectoryOrCreate
        - name: shared-models
          hostPath:
            path: "/olares/share/ai/model"
            type: DirectoryOrCreate
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: llamacppcodernext40bone
  name: llamacppcodernext40bone
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "llamacpp-codernext"
      port: 8000
      targetPort: 8000
  selector:
    io.kompose.service: llamacppcodernext40bone
