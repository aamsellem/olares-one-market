spec:
  versionName: 1.0.4
  upgradeDescription: |
    v1.0.0: initial release. **Qwen3-Coder-Next REAP 40B-A3B IQ4_XS** sibling
    of `llamacppcodernext40bone` (Q3_K_M Long Context). Higher quant = better
    code quality (~+5-10% on function signature accuracy), at the cost of a
    smaller context window.

    **Bench validated 2026-05-26 on Olares One** (Space Invaders, 3 runs):

    | Context | VRAM used | Speed steady |
    |---------|-----------|--------------|
    | 128K    | 22.8 GB   | **142.1 t/s** |
    | 262K    | OOM       | does not fit |

    Same speed envelope as Q3_K_M (memory-bandwidth bound, not compute bound on
    this A3B-class model) but with the Q4 weights giving cleaner code output.

    Why 262K doesn't fit: IQ4_XS model weights = 22.3 GB on disk → ~21.8 GB on
    GPU. At 262K with q4_0 KV cache (~1.6 GB) + activation buffers, total spikes
    above the 24 GB VRAM budget. 128K leaves ~1.2 GB headroom which is safe.

    Stack:
    - Image: `ghcr.io/ggml-org/llama.cpp:server-cuda13-b8740`
    - Model: `mradermacher/Qwen3-Coder-Next-REAP-40B-A3B-GGUF` IQ4_XS (22.3 GB)
    - `-ngl 99 -ctk q4_0 -ctv q4_0 -fa auto --swa-full -np 1 --mlock`
    - `-b 512 -ub 512 --op-offload --jinja`
    - `--ctx-size 131072` (128K)
    - `GGML_CUDA_GRAPH_OPT=1`

    **When to pick this vs Long Context (Q3_K_M)**:
    - **This (Q4)**: agentic tool calling, code generation, function-level edits,
      anything where signature accuracy matters more than context length
    - **Long Context (Q3)**: parsing large codebases, multi-file refactors,
      RAG over long docs, anything that benefits from 262K window

    No MTP draft head (same as Q3 sibling). If lovedheart bundles one in future
    we'd hit ~200+ t/s.

    OpenAI-compatible API on port 8000 with `--jinja` chat template + tool calling.
    Downloads model on first launch (~22 GB) and caches in app data volume.
  fullDescription: |
    Qwen3-Coder-Next REAP 40B-A3B IQ4_XS — higher-quant sibling of the Long
    Context variant. Trade-off: better code quality (Q4 vs Q3) for less context
    (128K vs 262K). Same 142 t/s decode speed (memory-bandwidth bound).

    Choose this app for active code generation / tool calling / agentic flows.
    Choose the Long Context sibling (`llamacppcodernext40bone`) for parsing big
    codebases or long-document workflows.

    Stack matches the catalog standard for llama.cpp A3B models on Olares One.

