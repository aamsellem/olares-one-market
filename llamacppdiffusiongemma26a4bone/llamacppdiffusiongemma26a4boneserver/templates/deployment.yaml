{{- if and .Values.admin .Values.bfl.username (eq .Values.admin .Values.bfl.username) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: llamacpp
    llm-backend: llamacpp
  name: llamacpp
  namespace: "{{ .Release.Namespace }}"
  annotations:
    applications.app.bytetrade.io/gpu-inject: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: llamacpp
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: llamacpp
    spec:
      initContainers:
        - name: model-downloader
          image: "docker.io/curlimages/curl:8.11.0"
          command:
            - sh
            - '-c'
            - |
              MODEL_PATH="/models/${MODEL_FILE}"
              if [ -f "$MODEL_PATH" ]; then
                echo "Model already downloaded: $MODEL_PATH"
                ls -lh "$MODEL_PATH"
              else
                echo "Downloading model from $MODEL_URL ..."
                curl -L --progress-bar -o "$MODEL_PATH" "$MODEL_URL"
                echo "Download complete."
                ls -lh "$MODEL_PATH"
              fi
          envFrom:
            - configMapRef:
                name: llamacpp-env
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - mountPath: "/models"
              name: models
      containers:
        - name: llamacpp-server
          image: "ghcr.io/ggerganov/llama.cpp:server"
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--model"
            - "/models/$(MODEL_FILE)"
            - "--alias"
            - "$(MODEL_ALIAS)"
            - "--ctx-size"
            - "$(CONTEXT_SIZE)"
            - "--n-gpu-layers"
            - "$(N_GPU_LAYERS)"
            - "--threads"
            - "$(THREADS)"
          envFrom:
            - configMapRef:
                name: llamacpp-env
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 60
          resources:
            limits:
              cpu: "6"
              memory: 20Gi
            requests:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - mountPath: "/models"
              name: models
        - name: litellm-register
          image: "docker.io/curlimages/curl:8.11.0"
          command:
            - sh
            - '-c'
            - |
              until curl -sf http://localhost:8080/health > /dev/null 2>&1; do
                sleep 5
              done
              LITELLM_KEY="sk-olares-litellm-{{ .Release.Namespace }}"
              LITELLM_URL="${LITELLM_SERVICE_URL}"
              BACKEND_URL="http://llamacpp.llamacppdiffusiongemma26a4boneserver-shared:8080/v1"
              register_model() {
                curl -sf -o /dev/null -w "%{http_code}" \
                  -X POST "${LITELLM_URL}/model/new" \
                  -H "Authorization: Bearer ${LITELLM_KEY}" \
                  -H "Content-Type: application/json" \
                  -d "{\"model_name\": \"${LITELLM_MODEL_NAME}\", \"litellm_params\": {\"model\": \"openai/${MODEL_ALIAS}\", \"api_base\": \"${BACKEND_URL}\"}}"
              }
              for i in $(seq 1 5); do register_model && break; sleep 30; done
              while true; do sleep 3600; register_model; done
          envFrom:
            - configMapRef:
                name: llamacpp-env
          resources:
            limits:
              cpu: 50m
              memory: 32Mi
            requests:
              cpu: 5m
              memory: 16Mi
      volumes:
        - name: models
          hostPath:
            path: "{{ .Values.userspace.userData }}/LlamaCpp/{{ .Release.Name }}/models"
            type: DirectoryOrCreate
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: llamacpp
  name: llamacpp
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "llamacpp"
      port: 8080
      targetPort: 8080
  selector:
    io.kompose.service: llamacpp
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: llamacpp
  name: sharedentrances-llamacpp
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "llamacpp"
      port: 80
      targetPort: 8080
  selector:
    io.kompose.service: llamacpp
{{- end }}
