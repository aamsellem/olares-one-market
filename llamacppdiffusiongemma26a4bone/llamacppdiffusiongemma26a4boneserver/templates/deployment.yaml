{{- if and .Values.admin .Values.bfl.username (eq .Values.admin .Values.bfl.username) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: vllm
    llm-backend: vllm
  name: vllm
  namespace: "{{ .Release.Namespace }}"
  annotations:
    applications.app.bytetrade.io/gpu-inject: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: vllm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: vllm
    spec:
      initContainers:
        - name: model-downloader
          image: "docker.io/curlimages/curl:8.11.0"
          command:
            - sh
            - '-c'
            - |
              MODEL_PATH="/models/${MODEL_FILE}"
              if [ -f "$MODEL_PATH" ]; then
                echo "Model already downloaded: $MODEL_PATH"
                ls -lh "$MODEL_PATH"
              else
                echo "Downloading model from $MODEL_URL ..."
                curl -L --progress-bar -o "$MODEL_PATH" "$MODEL_URL"
                echo "Download complete."
                ls -lh "$MODEL_PATH"
              fi
          envFrom:
            - configMapRef:
                name: vllm-env
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - mountPath: "/models"
              name: models
      containers:
        - name: vllm-server
          image: "vllm/vllm-openai:latest"
          args:
            - "--model"
            - "/models/$(MODEL_FILE)"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--speculative-config"
            - '{"model":"google/gemma-4-26B-A4B-it-assistant","method":"gemma4_mtp","num_speculative_tokens":3}'
            - "--max-model-len"
            - "$(CONTEXT_SIZE)"
            - "--gpu-memory-utilization"
            - "0.90"
            - "--enable-prefix-caching"
          envFrom:
            - configMapRef:
                name: vllm-env
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 30
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 60
          resources:
            limits:
              cpu: "16"
              memory: "40Gi"
              nvidia.com/gpu: "1"
            requests:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - mountPath: "/models"
              name: models
        - name: litellm-register
          image: "docker.io/curlimages/curl:8.11.0"
          command:
            - sh
            - '-c'
            - |
              until curl -sf http://localhost:8000/health > /dev/null 2>&1; do
                sleep 5
              done
              LITELLM_KEY="sk-olares-litellm-{{ .Release.Namespace }}"
              LITELLM_URL="${LITELLM_SERVICE_URL}"
              BACKEND_URL="http://vllm.vllmdiffusiongemma26a4boneserver-shared:8000/v1"
              register_model() {
                curl -sf -o /dev/null -w "%{http_code}" \
                  -X POST "${LITELLM_URL}/model/new" \
                  -H "Authorization: Bearer ${LITELLM_KEY}" \
                  -H "Content-Type: application/json" \
                  -d "{\"model_name\": \"${LITELLM_MODEL_NAME}\", \"litellm_params\": {\"model\": \"openai/${MODEL_ALIAS}\", \"api_base\": \"${BACKEND_URL}\"}}"
              }
              for i in $(seq 1 5); do register_model && break; sleep 30; done
              while true; do sleep 3600; register_model; done
          envFrom:
            - configMapRef:
                name: vllm-env
          resources:
            limits:
              cpu: 50m
              memory: 32Mi
            requests:
              cpu: 5m
              memory: 16Mi
      volumes:
        - name: models
          hostPath:
            path: "{{ .Values.userspace.userData }}/LlamaCpp/{{ .Release.Name }}/models"
            type: DirectoryOrCreate
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: vllm
  name: vllm
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "vllm"
      port: 8000
      targetPort: 8000
  selector:
    io.kompose.service: vllm
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: vllm
  name: sharedentrances-vllm
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "vllm"
      port: 80
      targetPort: 8000
  selector:
    io.kompose.service: vllm
{{- end }}
