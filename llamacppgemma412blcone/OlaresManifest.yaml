spec:
  versionName: 1.0.0
  upgradeDescription: |
    v1.0.0: **initial release — Gemma 4 12B long-context sibling of `llamacppgemma412bone`**.

    Where `llamacppgemma412bone` v1.0.3 prioritizes raw speed (102.8 t/s at 65K with MTP speculative decoding via the am17an gemma4-mtp branch), this variant prioritizes **full-context window**: 262K native context, vision intact, 87.8 t/s sustained decode, all fitting in 12 GB VRAM on a 24 GB consumer Blackwell.

    **The unlock**: Huawei CSL published KVarN (arXiv 2606.03458, 2026-06-04), a Hadamard-rotation + variance-normalization KV cache quantization that hits 4-bit keys / 2-bit values with FP16-level accuracy (59.3 vs 59.4 AIME25, calibration-free). Anbeeld integrated it into BeeLlama v0.3.2-preview the same day as `--cache-type-k kvarn4 --cache-type-v kvarn4` (the reference-aligned `k4v2_g128` preset per paper).

    On Gemma 4 12B QAT UD-Q4_K_XL with KVarN4 at 262K full native:
    - 3 runs Space Invaders: **88.57 / 88.77 / 86.07 t/s = AVG 87.80 t/s**
    - GPU: **12 GB** (vs 8.6 GB for v1.0.3 65K + MTP; KVarN compresses keys/values but doesn't eliminate them)
    - Vision: ✓ (BeeLlama loads Google's official mmproj-gemma-4-12b-it-qat-q4_0.gguf cleanly)
    - Tool calling: ✓
    - MTP: ✗ (BeeLlama doesn't carry am17an's Gemma 4 MTP head support; waiting for PR #23398 merge to combine both)

    **Comparison vs the speed sibling**:
    - vs `llamacppgemma412bone` v1.0.3 (102.8 t/s at 65K + MTP): **-15% speed, +4× context, +3.4 GB VRAM**
    - vs `llamacppgemma412bone` v1.0.2 baseline (87.5 t/s at 32K Q8_0 + MTP): **same speed, 8× context, -14% VRAM**

    **When to use this chart over `llamacppgemma412bone`**:
    - You need real long-context: indexing entire codebases, multi-document RAG, long agent traces, video frames
    - You're CPU-side, not throughput-side: latency per request is fine, you just need the model to remember things from far back
    - You're willing to give up MTP's +17% boost in exchange for the 4× window
    - You don't need agentic multi-turn under load (KVarN4 + 262K is single-user-optimal)

    **Stack**:
    - Image: `ghcr.io/anbeeld/beellama.cpp:server-cuda13-preview-v0.3.2`
    - Model: `unsloth/gemma-4-12B-it-qat-GGUF` UD-Q4_K_XL (6.4 GB, same as v1.0.3 sibling)
    - Mmproj: `google/gemma-4-12B-it-qat-q4_0-gguf/mmproj-gemma-4-12b-it-qat-q4_0.gguf` (167 MB)
    - KV: `--cache-type-k kvarn4 --cache-type-v kvarn4` (k4v2_g128 reference preset)
    - Context: **262144** native
    - Spec decoding: none (will be added once PR #23398 merges into ggml-org and a future BeeLlama rebase carries it)

    The "Long Context" badge and category surface this chart in market filtering distinct from the speed-optimized sibling.
  fullDescription: |
    Long-context variant of the Gemma 4 12B Olares One stack. Full 262K native context window with vision + tool calling intact, sustained 87.8 t/s decode on consumer Blackwell mobile.

    KVarN k4v2 KV cache compression (Huawei CSL 2026-06-04) makes a 262K context fit in 12 GB total VRAM. The 12B QAT base (Google + Unsloth UD-Q4_K_XL, ~7.5 GB) is the same as the speed sibling — only the inference path differs.

    Use this chart when you need long-context. Use the `llamacppgemma412bone` sibling when you need raw speed.

    First launch downloads ~7.6 GB from HuggingFace and caches it shared across users on the same Olares device at `/olares/share/ai/model/llms/`.

