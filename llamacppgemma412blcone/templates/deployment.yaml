---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llamacpp-gemma412blc-env
  namespace: "{{ .Release.Namespace }}"
data:
  TARGET_MODEL: "unsloth/gemma-4-12B-it-qat-GGUF"
  TARGET_FILE: "gemma-4-12B-it-qat-UD-Q4_K_XL.gguf"
  MMPROJ_MODEL: "google/gemma-4-12B-it-qat-q4_0-gguf"
  MMPROJ_FILE: "mmproj-gemma-4-12b-it-qat-q4_0.gguf"
  MODEL_ALIAS: "gemma-4-12b-long"
  CTX_SIZE: "262144"
  THREADS: "16"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: llamacppgemma412blcone
  name: llamacppgemma412blcone
  namespace: "{{ .Release.Namespace }}"
  annotations:
    applications.app.bytetrade.io/gpu-inject: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: llamacppgemma412blcone
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: llamacppgemma412blcone
    spec:
      containers:
        - name: gemma412blc-server
          image: "ghcr.io/anbeeld/beellama.cpp:server-cuda13-preview-v0.3.2"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              MODELS_DIR=${MODELS_DIR:-/models}
              SHARED_DIR=${SHARED_DIR:-/shared-models/llms}
              mkdir -p "$MODELS_DIR" "$SHARED_DIR"
              HF_AUTH=""
              if [ -n "$HF_TOKEN" ]; then HF_AUTH="-H \"Authorization: Bearer $HF_TOKEN\""; fi
              if [ -f "$MODELS_DIR/$TARGET_FILE" ] && [ ! -f "$SHARED_DIR/$TARGET_FILE.ok" ]; then
                echo "==> Migrating $TARGET_FILE → shared dir"
                mv "$MODELS_DIR/$TARGET_FILE" "$SHARED_DIR/$TARGET_FILE"
                touch "$SHARED_DIR/$TARGET_FILE.ok"
              fi
              if [ ! -f "$SHARED_DIR/$TARGET_FILE.ok" ]; then
                echo "==> Downloading $TARGET_MODEL/$TARGET_FILE (~7.5 GB UD-Q4_K_XL QAT)"
                eval curl -fL -C - --retry 20 --retry-delay 15 --retry-all-errors --connect-timeout 30 $HF_AUTH \
                  "https://huggingface.co/${TARGET_MODEL}/resolve/main/${TARGET_FILE}" \
                  -o "$SHARED_DIR/$TARGET_FILE"
                touch "$SHARED_DIR/$TARGET_FILE.ok"
              fi
              # mmproj from Google official QAT repo (unsloth UD repo's mmproj has wrong n_embd)
              if [ ! -f "$SHARED_DIR/$MMPROJ_FILE.ok" ]; then
                echo "==> Download mmproj from $MMPROJ_MODEL (~168 MB)"
                eval curl -fL -C - --retry 20 --retry-delay 15 $HF_AUTH \
                  "https://huggingface.co/${MMPROJ_MODEL}/resolve/main/${MMPROJ_FILE}" \
                  -o "$SHARED_DIR/$MMPROJ_FILE"
                touch "$SHARED_DIR/$MMPROJ_FILE.ok"
              fi
              exec /app/llama-server \
                --model "$SHARED_DIR/$TARGET_FILE" \
                --mmproj "$SHARED_DIR/$MMPROJ_FILE" \
                --alias "$MODEL_ALIAS" \
                --host 0.0.0.0 --port 8080 \
                --n-gpu-layers 99 \
                --ctx-size "${CTX_SIZE:-262144}" \
                --threads "${THREADS:-16}" \
                --cache-type-k kvarn4 --cache-type-v kvarn4 \
                --batch-size 512 --ubatch-size 2048 \
                --parallel 1 \
                --flash-attn on --jinja \
                --reasoning off
          envFrom:
            - configMapRef:
                name: llamacpp-gemma412blc-env
          env:
            - name: HF_HOME
              value: "/models/huggingface"
            - name: HF_TOKEN
              value: "{{ .Values.olaresEnv.OLARES_USER_HUGGINGFACE_TOKEN }}"
            - name: MODELS_DIR
              value: "/models"
            - name: CUDA_DEVICE_MEMORY_LIMIT_0
              value: "20000m"
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 600
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 720
          resources:
            limits:
              cpu: "12"
              memory: 24Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: 4000m
              memory: 12Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - mountPath: "/models"
              name: models
            - mountPath: "/shared-models"
              name: shared-models
      volumes:
        - name: models
          hostPath:
            path: "{{ .Values.userspace.appData }}/models"
            type: DirectoryOrCreate
        - name: shared-models
          hostPath:
            path: "/olares/share/ai/model"
            type: DirectoryOrCreate
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: llamacppgemma412blcone
  name: llamacppgemma412blcone
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "gemma412blc"
      port: 8080
      targetPort: 8080
  selector:
    io.kompose.service: llamacppgemma412blcone
