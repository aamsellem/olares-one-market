spec:
  versionName: 1.0.1
  upgradeDescription: |
    v1.0.1: **text-only release** — vision (mmproj) disabled because llama.cpp b8740 (CUDA 13.1.1) does not recognize the new `gemma4uv` projector type. Gemma 4 unified vision landed in upstream PR #24082 + #24088 on 2026-06-03 but no community Docker tag has shipped with those yet. Will re-enable vision in v1.0.2 once an upstream image with gemma4uv lands (or buun-llama-cpp rebases). Bench validated on Olares One: **47 t/s avg** (3 runs Space Invaders, very stable σ < 0.1).

    v1.0.0: initial release. **Gemma 4 12B IT** by Google — released 2026-06-03. Dense 12B parameter model (not MoE) with native multimodal vision support. The new mid-tier Gemma 4 size sitting between E4B (4B active MoE) and 26B-A4B.

    Stack:
    - `unsloth/gemma-4-12b-it-GGUF` Q8_0 (12.7 GB, lossless quality on a 12B base)
    - mmproj F16 (175 MB) for vision input
    - llama.cpp upstream `server-cuda13-b8740`
    - 32K context, full GPU offload, flash attention, jinja templates
    - OpenAI-compatible API on port 8080

    **No MTP yet**: Google released the assistant drafter (845 MB safetensors) but the GGUF conversion isn't in the community yet (AtomicChat/unsloth assistant-GGUF repos still empty). v1.0.1 will add MTP once the drafter GGUF lands — expected speedup from ~80-100 t/s base to ~150-180 t/s with MTP n=3.

    Vision: native multimodal input via `image_url` API parameter. Same flow as other mmproj-equipped models on Olares One (Qwen3.6 abliterated, Gemma 4 26B-A4B vision).

    Use cases:
    - General-purpose chat with vision (photos, screenshots, documents)
    - Multilingual reasoning (Gemma 4 has stronger non-English coverage than Qwen)
    - Tool calling with mid-tier model size — lighter than 26B-A4B but more capable than E4B

    Bench TBD on Olares One — expected 80-100 t/s base, will validate after install.
  fullDescription: |
    Google Gemma 4 12B IT released 2026-06-03. Dense 12B parameter instruction-tuned model with native vision support via mmproj.

    The mid-tier Gemma 4 size: bigger and more capable than E4B (4B active MoE), smaller and faster than 26B-A4B. Dense architecture (not MoE) means consistent throughput without router overhead.

    Stack:
    - Image: `ghcr.io/ggml-org/llama.cpp:server-cuda13-b8740` (upstream)
    - Model: `unsloth/gemma-4-12b-it-GGUF` Q8_0 (12.7 GB)
    - Vision: mmproj F16 (175 MB) for image_url inputs
    - 32K context, q8_0 KV cache, flash attention, jinja
    - OpenAI-compatible API at port 8080

    First launch downloads ~13 GB from HuggingFace and caches it shared across users on the same Olares device at `/olares/share/ai/model/llms/`.
  developer: aamsellem
