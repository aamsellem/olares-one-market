spec:
  versionName: '1.0.8'
  upgradeDescription: |
    v1.0.8: **fix missing `envs:` declaration for HF token**. `templates/deployment.yaml` referenced `HF_TOKEN={{ .Values.olaresEnv.OLARES_USER_HUGGINGFACE_TOKEN }}` but `OlaresManifest.yaml` never declared `OLARES_USER_HUGGINGFACE_TOKEN` in an `envs:` block — so Helm rendered `HF_TOKEN=""` and any gated-model download from HuggingFace failed with 401. Same class of bug as `nemotronlabselastic30bnvfp4one` v1.0.3 (Discord-reported crash loop). No functional change for public models; fixes gated-repo access. Declared `required: false` so install still works when the user hasn't configured a token in Olares Settings.

    v1.0.7: **swap drafter to Unsloth bundled MTP** (uploaded 2026-06-09 15:12 UTC). Unsloth re-uploaded their Gemma 4 QAT GGUF repos with the MTP drafters bundled in-repo: `unsloth/gemma-4-12B-it-qat-GGUF/mtp-gemma-4-12B-it.gguf` (444 MB, same size and arch as the Janvitos drafter we used in v1.0.4-v1.0.6). Switching to single-repo source — same TARGET_MODEL and DRAFTER_MODEL now, simpler chart config. No perf change expected (same Google-derived drafter, same model weights, same llama.cpp upstream image r3). Bench reference stays 169.76 t/s, 91% MTP draft acceptance.

    v1.0.6: **fix CrashLoopBackOff on fresh install** — Discord-reported bug. The custom image v1.0.5 (`aamsellem/llamacpp-gemma4mtp:main-postmerge-cuda131`) shipped without the `curl` CLI binary in the runtime stage (only `libcurl4` shared library). The chart's startup script uses `curl` to fetch the GGUF models from HuggingFace on first launch → fails immediately with `curl: command not found` → CrashLoopBackOff before the server can boot. My own install didn't hit it because the models were already cached from v1.0.4 (`.ok` markers existed, download blocks skipped).

    Fix: rebuilt image as `:main-postmerge-cuda131-r2` with `apt-get install curl` added to the runtime stage. Same llama.cpp main HEAD source, same speed (169.76 t/s), same everything else — just the missing CLI binary.

    v1.0.5: **+67% speed via llama.cpp Gemma 4 MTP upstream merge** — swap our custom `aamsellem/llama-cpp-gemma4mtp:am17an-dd97604` (snapshot of am17an's WIP PR #23398 branch) → `aamsellem/llamacpp-gemma4mtp:main-postmerge-cuda131` (built from ggml-org/llama.cpp main HEAD after PR #23398 merged 2026-06-07T12:50 UTC).

    **What's new in upstream main vs the am17an snapshot we had**:
    - ggerganov's review-cycle polish (10+ commits between dd97604 and the final merge)
    - MTP graph reuse fixes (Gemma 4-specific path)
    - llama_context clean-up
    - quantized-cache path corrections
    - All the post-rebase arch fixes that the community drafters (Janvitos, cortexist) now target

    Same config otherwise: QAT UD-Q4_K_XL target, Janvitos QAT-matched drafter, Google official mmproj, q8_0/q8_0 KV, 65K ctx, MTP n=2.

    **Bench Olares One** (3 runs Space Invaders, same prompt as v1.0.4):
    - 170.03 / 169.46 / 169.78 t/s = **AVG 169.76 t/s** (vs v1.0.4 101.7 t/s = **+66.9%**)
    - MTP draft acceptance: 90.4-90.9% (vs v1.0.4 91.4% = noise)
    - GPU usage: 8.6 GB (unchanged)

    **Notable**: this is the same hardware, same model, same drafter, same KV config, same context — pure upstream improvement. The dd97604 snapshot was capturing an in-flight WIP branch; the final merged version is dramatically faster on Gemma 4 + MTP.

    Image built locally from ggml-org main HEAD on `nvidia/cuda:13.1.1-devel-ubuntu24.04` base. The official ggml-org Docker pipeline bumped to CUDA 13.3 the same day, which is incompatible with Olares driver 590.44.01 (caps at CUDA 13.1.x) — that's why we keep a custom-built image even though the upstream merge is now public.

    v1.0.4: **QAT-matched MTP drafter** — swap `colefuoco00/gemma-4-12B-it-assistant-GGUF` Q8_0 (community, non-QAT base) → `Janvitos/gemma-4-12B-it-qat-assistant-MTP-Q8_0-GGUF` Q8_0 (community GGUF conversion of Google's official `google/gemma-4-12B-it-qat-q4_0-unquantized-assistant` checkpoint).

    Both drafters share the same `gemma4-assistant` GGUF architecture (with hyphen) which is what our am17an `dd97604` image accepts. ji-farthing's `gemma4_mtp` (ik_llama convention) and cortexist's `gemma4_assistant` (underscore, newer am17an convention) both fail to load on our snapshot — verified empirically.

    **Bench Olares One** (3 runs Space Invaders @ n_max=2, same config as v1.0.3 except drafter):
    - 103.97 / 102.73 / 98.40 t/s = **AVG 101.7 t/s** (vs v1.0.3 102.78 t/s = noise -1%)
    - **MTP draft acceptance: 91.4%** (vs v1.0.3 colefuoco 72.5-75.0% = **+18 pts**)

    The +18 pts accept rate is the headline: same speed, but the drafter's tokens now match the target's distribution 91% of the time vs 73%. That translates to:
    - Fewer wasted compute cycles on rejected drafts
    - Lower latency variance
    - More reliable structured outputs / tool calling (drafted tool-call structures align better with what target would emit)

    Tested `--spec-draft-n-max 4` (Janvitos README's suggested value) → regressed to 98.6 t/s with 82% accept. Higher n reduces deep-position accept rate faster than the extra n adds throughput. **n=2 is the sweet spot on this hardware**.

    v1.0.3: **Gemma 4 QAT upgrade — +17% speed, -39% VRAM**. Google released Gemma 4 QAT (Quantization-Aware Training) on 2026-06-05. QAT models keep Q8_0-grade quality at Q4_0 file size by training the model to be robust to quantization noise. Unsloth published `unsloth/gemma-4-12B-it-qat-GGUF` 2h after release with their UD-Q4_K_XL imatrix variant (~7.5 GB vs prior Q8_0 12.7 GB).

    **Switch**: `unsloth/gemma-4-12b-it-GGUF` Q8_0 → `unsloth/gemma-4-12B-it-qat-GGUF` UD-Q4_K_XL.

    **mmproj fix**: unsloth's mmproj-BF16.gguf in the QAT repo has n_embd=2048 (E4B-sized, wrong for 12B which needs 3840). Pulled Google's official `mmproj-gemma-4-12b-it-qat-q4_0.gguf` from `google/gemma-4-12B-it-qat-q4_0-gguf` instead — loads cleanly with unsloth UD weights since both derive from the same Google QAT BF16 base.

    **Bench Olares One** (3 runs Space Invaders, vision-loaded, MTP active):
    - 107.18 / 100.89 / 100.27 t/s = **AVG 102.78 t/s** (vs v1.0.2 87.5 t/s = **+17.4%**)
    - MTP draft acceptance: 72.5-75.0% (vs v1.0.2 84-88%; lower but excellent)
    - GPU usage: **8.6 GB** (vs v1.0.2 ~14 GB = **-39% VRAM**)

    Free VRAM bumped context **32K → 65K**, with margin to spare. Same am17an PR #23398 image, same colefuoco MTP drafter, same q8_0/q8_0 KV.

    v1.0.2: **+86% speedup with MTP** (Gemma 4 12B-it-assistant drafter). Custom image `aamsellem/llama-cpp-gemma4mtp:am17an-dd97604` built from am17an's gemma4-mtp branch (PR #23398) — adds Gemma 4 MTP support AND `gemma4uv` projector for vision (PR #24082) in one image. Drafter `colefuoco00/gemma-4-12B-it-assistant-GGUF` Q8_0 (465 MB) used via `--model-draft + --spec-type draft-mtp + --spec-draft-n-max 2`. Bench on Olares One (3 runs Space Invaders): 86.29 / 88.25 / 88.07 t/s = **AVG 87.5 t/s** with **84-88% MTP accept rate** vs v1.0.1 baseline 47 t/s = **1.86x speedup**. Vision (mmproj F16) re-enabled — gemma4uv projector loaded, accepts `image_url` API.

    v1.0.1: **text-only release** — vision (mmproj) disabled because llama.cpp b8740 (CUDA 13.1.1) does not recognize the new `gemma4uv` projector type. Gemma 4 unified vision landed in upstream PR #24082 + #24088 on 2026-06-03 but no community Docker tag has shipped with those yet. Will re-enable vision in v1.0.2 once an upstream image with gemma4uv lands (or buun-llama-cpp rebases). Bench validated on Olares One: **47 t/s avg** (3 runs Space Invaders, very stable σ < 0.1).

    v1.0.0: initial release. **Gemma 4 12B IT** by Google — released 2026-06-03. Dense 12B parameter model (not MoE) with native multimodal vision support. The new mid-tier Gemma 4 size sitting between E4B (4B active MoE) and 26B-A4B.

    Stack:
    - `unsloth/gemma-4-12b-it-GGUF` Q8_0 (12.7 GB, lossless quality on a 12B base)
    - mmproj F16 (175 MB) for vision input
    - llama.cpp upstream `server-cuda13-b8740`
    - 32K context, full GPU offload, flash attention, jinja templates
    - OpenAI-compatible API on port 8080

    **No MTP yet**: Google released the assistant drafter (845 MB safetensors) but the GGUF conversion isn't in the community yet (AtomicChat/unsloth assistant-GGUF repos still empty). v1.0.1 will add MTP once the drafter GGUF lands — expected speedup from ~80-100 t/s base to ~150-180 t/s with MTP n=3.

    Vision: native multimodal input via `image_url` API parameter. Same flow as other mmproj-equipped models on Olares One (Qwen3.6 abliterated, Gemma 4 26B-A4B vision).

    Use cases:
    - General-purpose chat with vision (photos, screenshots, documents)
    - Multilingual reasoning (Gemma 4 has stronger non-English coverage than Qwen)
    - Tool calling with mid-tier model size — lighter than 26B-A4B but more capable than E4B

    Bench TBD on Olares One — expected 80-100 t/s base, will validate after install.
  fullDescription: |
    Google Gemma 4 12B IT released 2026-06-03. Dense 12B parameter instruction-tuned model with native vision support via mmproj.

    The mid-tier Gemma 4 size: bigger and more capable than E4B (4B active MoE), smaller and faster than 26B-A4B. Dense architecture (not MoE) means consistent throughput without router overhead.

    Stack:
    - Image: `ghcr.io/ggml-org/llama.cpp:server-cuda13-b8740` (upstream)
    - Model: `unsloth/gemma-4-12b-it-GGUF` Q8_0 (12.7 GB)
    - Vision: mmproj F16 (175 MB) for image_url inputs
    - 32K context, q8_0 KV cache, flash attention, jinja
    - OpenAI-compatible API at port 8080

    First launch downloads ~13 GB from HuggingFace and caches it shared across users on the same Olares device at `/olares/share/ai/model/llms/`.
