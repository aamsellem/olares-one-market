metadata:
  title: Gemma 4 12B One
  description: "Google's Gemma 4 12B IT — dense 12B + vision (mmproj) — released 2026-06-03 — via llama.cpp on Olares One"

spec:
  fullDescription: |
    Google Gemma 4 12B IT — dense 12B instruction-tuned model with native vision support, released 2026-06-03. Mid-tier size between Gemma 4 E4B (4B active) and 26B-A4B.

    Stack:
    - `unsloth/gemma-4-12b-it-GGUF` Q8_0 (12.7 GB, lossless on 12B base)
    - mmproj F16 (175 MB) for vision input via OpenAI-compatible `image_url`
    - llama.cpp upstream `server-cuda13-b8740`
    - 32K context, full GPU offload, q8_0 KV cache, flash attention
    - OpenAI-compatible API on port 8080

    No MTP yet (assistant drafter GGUF not in community yet) — v1.0.1 will add it once available (expected ~150-180 t/s with MTP n=3 vs ~80-100 t/s base).
