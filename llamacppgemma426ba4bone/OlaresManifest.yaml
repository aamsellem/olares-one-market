spec:
  versionName: 1.0.2
  upgradeDescription: |
    v1.0.2: **bench validated — 286.6 t/s on Olares One**. 3 runs Space Invaders @ MTP n=2, 2048 tokens each:
    - 288.71 / 284.79 / 286.33 t/s = **AVG 286.61 t/s**
    - MTP draft acceptance: 90.1% / 92.3% / 91.2% = **AVG 91.2%**
    - VRAM: 16.6 GB total (text + mmproj loaded)

    **Matches `llamacppgemma4audione` (288.4 t/s, Gemma 4 E4B)** — both run ~4B active params per token, so decode speed converges. But this gives 26B of total reasoning capacity instead of 8B (E4B is MoE 8B-A4B). Same 91% MTP accept as the 12B QAT (`llamacppgemma412bone` v1.0.5).

    No chart changes vs v1.0.1 — metadata bump only to surface the bench numbers in the market UI (bento + hero + description).

    v1.0.1: **fix mmproj n_embd mismatch on first launch**. Unsloth's `mmproj-BF16.gguf` in the 26B-A4B QAT repo has `n_embd=2048` (E4B-sized) but the 26B-A4B text model has `n_embd=2816` → llama-server fails with `mismatch between text model (n_embd = 2816) and mmproj (n_embd = 2048)` and CrashLoopBackOffs. Same trap as `llamacppgemma412bone` v1.0.3.

    Fix: swap to Google's official `gemma-4-26B-it-mmproj.gguf` from `google/gemma-4-26B-A4B-it-qat-q4_0-gguf` repo — correct n_embd=2816, loads cleanly with the Unsloth UD-Q4_K_XL target since both derive from the same Google QAT BF16 base.

    Everything else unchanged: same custom image r3, same Unsloth bundled MTP drafter, same 32K context, same KV config.

    Bench TBD.

    v1.0.0: initial release. **Gemma 4 26B-A4B QAT** — Google's MoE variant of Gemma 4 (26B total parameters, 4B active per token). The QAT (Quantization-Aware Training) variant keeps Q8_0-grade quality at Q4_0 file size.

    Stack:
    - Image: `aamsellem/llamacpp-gemma4mtp:main-postmerge-cuda131-r3` (custom build from llama.cpp main HEAD on CUDA 13.1.1 — Olares driver 590.44.01 caps at CUDA 13.1.x, so upstream ggml-org tags post-2026-06-07 are unusable)
    - Target: `unsloth/gemma-4-26B-A4B-it-qat-GGUF/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf` (~13.6 GB)
    - Vision: mmproj BF16 (~1.14 GB) from same Unsloth QAT repo
    - MTP drafter: `unsloth/gemma-4-26B-A4B-it-qat-GGUF/mtp-gemma-4-26B-A4B-it.gguf` (~240 MB, bundled in the same Unsloth repo as the target and mmproj)
    - 32K context, q8_0/q8_0 KV cache, flash attention, jinja templates
    - MTP n=2, full GPU offload
    - OpenAI-compatible API at port 8080

    **Why this chart**: Olares One already has `llamacppgemma4audione` (E4B + audio, 288 t/s) and `llamacppgemma412bone` (12B dense, 170 t/s). 26B-A4B fills the middle tier — bigger reasoning capacity than 12B (26B total params vs 12B) while keeping decode throughput comparable to a 4B dense model (only 4B params active per token). The MoE architecture makes it the most VRAM-efficient way to get strong reasoning on 24 GB consumer Blackwell.

    First launch downloads ~15 GB from HuggingFace into `/olares/share/ai/model/llms/` (shared cache across users on the same device).

    Bench TBD — will validate after install on Olares One. Expected range: 100-150 t/s with MTP n=2 based on extrapolation from E4B (288 t/s, 4B active) and 12B dense (170 t/s).
  fullDescription: |
    Google Gemma 4 26B-A4B QAT — the Mixture-of-Experts variant of Gemma 4. 26 billion total parameters, only 4 billion active per token. QAT (Quantization-Aware Training) means the model was trained to remain accurate after Q4_0 quantization, giving Q8_0-grade quality at Q4_0 file size.

    Why 26B-A4B vs 12B dense:
    - Bigger overall reasoning capacity (26B params total) than 12B dense
    - Decode speed in the same league as a 4B dense model (only 4B params active per token, MoE routes to 2 experts out of 8 per token)
    - Native vision via mmproj
    - Native MTP (Multi-Token Prediction) drafter for ~2x speculative-decode speedup

    Stack:
    - Image: custom `aamsellem/llamacpp-gemma4mtp:main-postmerge-cuda131-r3` built from llama.cpp main HEAD on `nvidia/cuda:13.1.1-devel-ubuntu24.04` (Olares driver 590.44.01 caps at CUDA 13.1, so we don't use the upstream ggml-org tags that bumped to CUDA 13.3 on 2026-06-07)
    - Target model: `unsloth/gemma-4-26B-A4B-it-qat-GGUF/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf` (~13.6 GB)
    - Vision: mmproj BF16 (~1.14 GB) from same Unsloth QAT repo
    - MTP drafter: `mtp-gemma-4-26B-A4B-it.gguf` (~240 MB, bundled in same repo)
    - 32K context, q8_0/q8_0 KV cache, flash attention, jinja
    - OpenAI-compatible API at port 8080

    First launch downloads ~15 GB from HuggingFace and caches it at `/olares/share/ai/model/llms/` (shared across users on the same Olares device).

    Use cases:
    - General-purpose chat with vision (photos, screenshots, documents)
    - Tool calling / agentic workflows that need stronger reasoning than 12B dense
    - Multilingual reasoning (Gemma 4 has strong non-English coverage)
    - Best quality-per-VRAM-per-token-per-second on 24 GB consumer Blackwell
