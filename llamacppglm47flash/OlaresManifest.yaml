      supportMultiCard: false
      supportMultiNodes: false
      requiredCpu: "4"
      limitedCpu: "16"
      requiredMemory: 20Gi
      limitedMemory: 40Gi
      requiredDisk: 25Gi
      limitedDisk: 40Gi
      requiredGPUMemory: 23Gi
      limitedGPUMemory: 23Gi
permission:
