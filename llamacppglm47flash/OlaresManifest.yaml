olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  llamacppglm47flash: 1

metadata:
  name: llamacppglm47flash
  icon: https://orales-one-market.aamsellem.workers.dev/icons/llamacppglm47flash.png
  description: "GLM-4.7-Flash 30B-A3B via llama.cpp — optimized for Olares One"
  appid: llamacppglm47flash
  title: GLM-4.7-Flash (Olares One)
  version: '1.1.1'
  categories:
    - LLM Chat
entrances:
  - name: llamacppglm47flash
    port: 8080
    host: llamacppglm47flash
    title: GLM-47-Flash One
    icon: https://orales-one-market.aamsellem.workers.dev/icons/llamacppglm47flash.png
    openMethod: window
