---
olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  llamacppnemotron30a3bone: 1

metadata:
  name: llamacppnemotron30a3bone
  icon: https://orales-one-market.aamsellem.workers.dev/icons/llamacppnemotron30a3bone.png
  description: "Nemotron 3 Nano 30B-A3B via llama.cpp — optimized for Olares One"
  appid: llamacppnemotron30a3bone
  title: Nemotron 30B-A3B Olares One
  version: '1.1.1'
  categories:
    - LLM Chat
entrances:
  - name: llamacppnemotron30a3bone
    port: 8080
    host: llamacppnemotron30a3bone
    title: Nemotron 30B-A3B One
    icon: https://orales-one-market.aamsellem.workers.dev/icons/llamacppnemotron30a3bone.png
    openMethod: window
    authLevel: internal
spec:
  versionName: '1.1.1'
  upgradeDescription: |
    v1.1.1: **Olares 1.12.6+ compatibility: manifest migrated to apiVersion v3.** Olares 1.12.6 deprecated apiVersion v2 apps: installed v2 versions keep running but can no longer be upgraded ("This app version has been deprecated and cannot be upgraded") or installed. If you run a previous version, **uninstall it and install 1.1.1**; model files in the shared model folder are kept. No change to the inference stack. Requires Olares >= 1.12.6.

    v1.0.6: llama.cpp b8667 → b8667 (Hadamard rotation). KV cache q4_0 (with Hadamard rotation) → q4_0. Context 64K → 128K (Mamba-2 hybrid = tiny KV cache).

  fullDescription: |
    Nemotron 3 Nano 30B-A3B (Hybrid Mamba-Transformer MoE, 3.5B active) served via llama.cpp — optimized for Olares One.
    RTX 5090M (24GB) + 96GB DDR5 + Core Ultra 9 275HX.
    Unsloth Dynamic Q4_K_XL quantization (important layers upcasted to 8/16-bit).
    64K context (only 6 attention layers = tiny KV cache, Mamba-2 SSM handles the rest).
    Hybrid architecture: 23 Mamba-2 layers + 6 GQA attention layers + MoE FFN.
    Flash attention, CUDA graph optimization, and op-offload enabled.
    Built-in reasoning mode with think/no-think toggle via chat template.
    Downloads the GGUF model on first launch (~23GB) and caches it.
    Exposes an OpenAI-compatible API on port 8080.

  developer: aamsellem
  website: https://github.com/aamsellem/olares-one-market
  sourceCode: https://github.com/aamsellem/olares-one-market
  submitter: aamsellem
  locale:
    - en-US
  license:
    - text: NVIDIA Nemotron Open Model License
      url: https://www.nvidia.com/en-us/agreements/enterprise-software/nvidia-nemotron-open-model-license/


  supportArch:
    - amd64
  accelerator:
    - mode: nvidia
      supportMultiCard: false
      supportMultiNodes: false
      requiredCpu: "4"
      limitedCpu: "16"
      requiredMemory: 24Gi
      limitedMemory: 40Gi
      requiredDisk: 30Gi
      limitedDisk: 50Gi
      requiredGPUMemory: 23Gi
      limitedGPUMemory: 23Gi
permission:
  appData: true
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
