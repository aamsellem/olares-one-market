spec:
  versionName: '1.0.31'
  upgradeDescription: |
    v1.0.31: **CUDA 13.3 image, +11% decode.** Switched from `ghcr.io/ggml-org/llama.cpp:server-cuda13-b8740` to `docker.io/beclab/ggml-org-llama.cpp:server-cuda13-b11046` (CUDA 13.3 runtime via the bundled forward-compat libcuda, runs on the Olares 595.84 / CUDA 13.2 driver). `--mlock` became `--load-mode mmap+mlock` (the flag was merged upstream). Bench on Olares One 2026-09-30, same args, only the image changed (Qwen3.5-35B-A3B UD-Q4_K_XL): Space Invaders HTML 143.23 → **159.04 t/s**, code prompt 141.53 → **158.23 t/s**.

    v1.0.25: llama.cpp b8496 → b8667 (Hadamard rotation for KV cache, NVFP4 MMQ kernel, Gemma 4 support). KV cache q8_0 → q4_0 (2x compression, same quality via rotation). Test build.
  fullDescription: |
    Qwen3.5 35B-A3B (MoE, 3B active) served via llama.cpp — optimized for Olares One.
    RTX 5090M (24GB) + 96GB DDR5 + Core Ultra 9 275HX.
    Unsloth Dynamic Q4_K_XL quantization (important layers upcasted to 8/16-bit).
    llama.cpp b8667 with Hadamard rotation for better KV cache quantization.
    KV cache q4_0 (2x smaller than q8_0, same quality via rotation).
    Flash attention, CUDA graph optimization, and op-offload enabled.
    Downloads the GGUF model on first launch (~22GB) and caches it.
    Exposes an OpenAI-compatible API on port 8080.

