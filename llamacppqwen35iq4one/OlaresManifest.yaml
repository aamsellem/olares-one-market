spec:
  versionName: '1.0.9'
  upgradeDescription: |
    v1.0.9: **CUDA 13.3 image, +13% decode.** Switched from `ghcr.io/ggml-org/llama.cpp:server-cuda13-b8740` to `docker.io/beclab/ggml-org-llama.cpp:server-cuda13-b11046` (CUDA 13.3 runtime via the bundled forward-compat libcuda, runs on the Olares 595.84 / CUDA 13.2 driver). `--mlock` became `--load-mode mmap+mlock` (the flag was merged upstream). Bench on Olares One 2026-09-30, same args, only the image changed (Qwen3.5-35B-A3B UD-IQ4_XS): Space Invaders HTML 144.27 → **162.54 t/s**, code prompt 139.94 → **159.12 t/s**.

    v1.0.3: llama.cpp b8667 → b8667 (Hadamard rotation). KV cache q4_0 (with Hadamard rotation) → q4_0 (2x compression).
  fullDescription: |
    Qwen3.5 35B-A3B (MoE, 3B active) served via llama.cpp — long context optimized for Olares One.
    RTX 5090M (24GB) + 96GB DDR5 + Core Ultra 9 275HX.
    Unsloth Dynamic IQ4_XS quantization (17.5GB) — 6.5GB free for KV cache.
    128K context window (vs 32K for the Q4_K_XL variant).
    Compact 4-bit quant with imatrix optimization, slight quality tradeoff for much longer context.
    Flash attention, CUDA graph optimization, and op-offload enabled.
    llama.cpp b8369 with Gated Delta Net op.
    Downloads the GGUF model on first launch (~17.5GB) and caches it.
    Exposes an OpenAI-compatible API on port 8080.

