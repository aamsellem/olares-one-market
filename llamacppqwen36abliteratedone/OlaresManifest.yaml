spec:
  onlyAdmin: true
  versionName: '1.1.5'
  upgradeDescription: |
    v1.1.5: **Restore v1.0.9 engine args** for A/B test: `-c 65536 -ngl 99 --threads 16 -fa on -ctk q8_0 -ctv turbo4 --jinja -np 1 --reasoning off --spec-type draft-mtp --spec-draft-n-max 3 --mmproj-gpu-swap`. Stop stripping MTP in wrapper. Keep buun + llm-init + mmproj sibling fallback.

    v1.1.4: **Unstick engine after 1.1.3**. llm-init v1.3.1 downloaded `role=mmproj` but never wrote `/run/llm-init/mmproj_path` → wrapper waited forever. Now fall back to sibling `mmproj*.gguf` next to `model_path`. Also strip `--spec-type`/`--spec-draft-n-max` from ENGINE_ARGS at runtime (upgrade preserves old env with broken MTP).

    v1.1.3: **fix ???? on olarestest001 (live logs)**. Root causes: (1) stale `model_download_finish` let the engine start before llm-init finished — no mmproj_path; (2) BeeLlama v0.3.1 still served requests as `Chat format: peg-native` → known Qwen thinking garbage; (3) MTP `accepted 0/3` every step. Fixes: wait for `model_path` + finish; image rollback `beellama v0.3.1` → `aamsellem/buun-llama-cpp:87c351d2`; disable MTP in default ENGINE_ARGS.

    v1.1.2: **fix all-????? garbled output**. Wrapper now loads the exact GGUF via llm-init `model_path` sentinel (`--model …`) instead of `-hf repo:Q4_K` (huihui filename does not match -hf quant resolution → wrong/partial weights → ????). mmproj download switched to indexed `MODEL_SOURCE_*` with `ROLE=mmproj` so vision projector is wired correctly. Keep explicit `--chat-template-file` (BeeLlama PEG garbage fix).

    v1.1.1: lower `requiredGPUMemory` / `LLAMACPP_REQUIRED_GPU_MEMORY` 24Gi → **23Gi** so install fits RTX 5090M usable VRAM (~24463 MiB). 24Gi (24576 MiB) exceeded card capacity → `compute resource is not enough for selected mode nvidia`.

    v1.1.0: **Olares 1.12.6 v3 + llm-init + appCommon**. Download path moved from custom curl/`/olares/share/ai/model` to Model Console (`beclab/llm-init:v1.3.1`) writing into shared `appCommon/huggingface` (`/cache/hf/hub`). Engine stays BeeLlama `ghcr.io/anbeeld/beellama.cpp:server-cuda13-v0.3.1` (MTP + mmproj-gpu-swap). Entrance is llm-init on :8090 (proxies to llama.cpp :8081). Manifest `apiVersion: v3`, `olaresManifest.version: 0.12.0`, `accelerator[]`, `workloadReplicas`, `options.shared: true`. Same Q4_K + mmproj + asym KV + MTP n=3 + chat-template ConfigMap.

    v1.0.9: upgrade to BeeLlama v0.3.1.
    v1.0.8: asymmetric KV cache q8_0-K / turbo4-V.
  fullDescription: |
    **Model Overview**
    Qwen3.6 35B-A3B with Claude 4.7 Opus reasoning distillation + huihui-ai abliteration (no forced refusals), served via BeeLlama llama.cpp with MTP speculative decoding and vision (mmproj-gpu-swap).

    **Preset Configuration**
    - Model: `huihui-ai/Huihui-Qwen3.6-35B-A3B-Claude-4.7-Opus-abliterated-MTP-GGUF` Q4_K + `mmproj-model-f16.gguf`
    - Capabilities: vision, tools, thinking
    - Engine args: `-c 65536 -ngl 99 --threads 16 -fa on -ctk q8_0 -ctv turbo4 --jinja -np 1 --reasoning off --spec-type draft-mtp --spec-draft-n-max 3 --mmproj-gpu-swap`
    - Required GPU memory: `23Gi`

    **How It Works**
    First, Model Console (`llm-init`) downloads the GGUF + mmproj into the shared `appCommon/huggingface` cache, then BeeLlama starts when the readiness sentinel is ready. OpenAI-compatible API is on port 8090 (llm-init proxies to llama.cpp on 8081).

    **Stack**
    - **BeeLlama** (`server-cuda13-v0.3.1`): inference + MTP + mmproj-gpu-swap (port 8081)
    - **Model Console** (`llm-init v1.3.1`): download progress + OpenAI API proxy (port 8090)

    **Model Storage**
    All model files are stored in the shared folder `appCommon/huggingface`, mounted as `/cache/hf/hub`.

    **NOT for production-facing apps** — without the safety layer, you own moderation responsibility entirely.

  developer: aamsellem
  website: https://huggingface.co/huihui-ai/Huihui-Qwen3.6-35B-A3B-Claude-4.7-Opus-abliterated-MTP-GGUF
  sourceCode: https://github.com/aamsellem/olares-one-market
  submitter: aamsellem
  locale:
    - en-US
  license:
    - text: Apache-2.0
      url: https://huggingface.co/huihui-ai/Huihui-Qwen3.6-35B-A3B-Claude-4.7-Opus-abliterated-MTP-GGUF

  accelerator:
    - mode: nvidia
      limitedCpu: "15360m"
      requiredCpu: "1200m"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "32Gi"
      requiredMemory: "22Gi"
      requiredGPUMemory: "23Gi"
      limitedGPUMemory: "23Gi"

  supportArch:
    - amd64
permission:
  appData: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  - envName: MODEL_SOURCE_NUM
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "2"
    description: "Indexed multi-source count (main GGUF + mmproj)."
  - envName: MODEL_SOURCE_1
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "hf://huihui-ai/Huihui-Qwen3.6-35B-A3B-Claude-4.7-Opus-abliterated-MTP-GGUF --include Huihui-Qwen3.6-35B-A3B-Claude-4.7-Opus-abliterated-ggml-model-Q4_K.gguf"
    description: "Main GGUF (role=main)."
    regex: "^hf://"
  - envName: MODEL_SOURCE_2
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "hf://huihui-ai/Huihui-Qwen3.6-35B-A3B-Claude-4.7-Opus-abliterated-MTP-GGUF --include mmproj-model-f16.gguf"
    description: "Vision projector GGUF."
    regex: "^hf://"
  - envName: MODEL_SOURCE_2_ROLE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "mmproj"
    description: "Must be mmproj so llm-init writes mmproj_path sentinel."
  - envName: MODEL_NAME
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "huihui-ai/Huihui-Qwen3.6-35B-A3B-Claude-4.7-Opus-abliterated-MTP-GGUF:Q4_K"
    description: "Client model id / alias (engine loads via model_path, not -hf)."
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "chat"
    options:
    - title: Chat
      value: chat
    - title: Embedding
      value: embedding
  - envName: MODEL_SUPPORTS
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "vision,tools,thinking"
    multiSelect: true
    splitter: ","
    options:
    - title: Vision
      value: vision
    - title: Tools
      value: tools
    - title: Thinking
      value: thinking
    - title: None
      value: none
    description: "Model capabilities exposed to the gateway."
  - envName: ENGINE_ARGS
    required: true
    type: string
    editable: true
    applyOnChange: true
    default: "-c 65536 -ngl 99 --threads 16 -fa on -ctk q8_0 -ctv turbo4 --jinja -np 1 --reasoning off --spec-type draft-mtp --spec-draft-n-max 3 --mmproj-gpu-swap"
    description: "Aligned with v1.0.9 llama-server flags (ctx 65K, MTP n=3, threads 16)."
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
  - envName: LLAMACPP_CPU_REQUEST
    required: true
    default: "200m"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_MEMORY_REQUEST
    required: true
    default: "21Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_CPU_LIMIT
    required: true
    default: "6"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_MEMORY_LIMIT
    required: true
    default: "30Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_REQUIRED_GPU_MEMORY
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "23Gi"
    description: "GPU memory for this preset → nvidia.com/gpumem on NVIDIA."
    regex: "^[0-9]+(Gi|Mi)?$"
