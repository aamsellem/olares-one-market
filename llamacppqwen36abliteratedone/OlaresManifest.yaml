  supportArch:
    - amd64
permission:
  appData: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  - envName: MODEL_SOURCE_NUM
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "2"
    description: "Indexed multi-source count (main GGUF + mmproj)."
  - envName: MODEL_SOURCE_1
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "hf://huihui-ai/Huihui-Qwen3.6-35B-A3B-Claude-4.7-Opus-abliterated-MTP-GGUF --include Huihui-Qwen3.6-35B-A3B-Claude-4.7-Opus-abliterated-ggml-model-Q4_K.gguf"
    description: "Main GGUF (role=main)."
    regex: "^hf://"
  - envName: MODEL_SOURCE_2
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "hf://huihui-ai/Huihui-Qwen3.6-35B-A3B-Claude-4.7-Opus-abliterated-MTP-GGUF --include mmproj-model-f16.gguf"
    description: "Vision projector GGUF."
    regex: "^hf://"
  - envName: MODEL_SOURCE_2_ROLE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "mmproj"
    description: "Must be mmproj so llm-init writes mmproj_path sentinel."
  - envName: MODEL_NAME
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "huihui-ai/Huihui-Qwen3.6-35B-A3B-Claude-4.7-Opus-abliterated-MTP-GGUF:Q4_K"
    description: "Client model id / alias (engine loads via model_path, not -hf)."
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "chat"
    options:
    - title: Chat
      value: chat
    - title: Embedding
      value: embedding
  - envName: MODEL_SUPPORTS
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "vision,tools,thinking"
    multiSelect: true
    splitter: ","
    options:
    - title: Vision
      value: vision
    - title: Tools
      value: tools
    - title: Thinking
      value: thinking
    - title: None
      value: none
    description: "Model capabilities exposed to the gateway."
  - envName: ENGINE_ARGS
    required: true
    type: string
    editable: true
    applyOnChange: true
    default: "-c 65536 -ngl 99 --threads 16 -fa on -ctk q8_0 -ctv turbo4 --jinja -np 1 --reasoning off --spec-type draft-mtp --spec-draft-n-max 3 --mmproj-gpu-swap"
    description: "Aligned with v1.0.9 llama-server flags (ctx 65K, MTP n=3, threads 16)."
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
  - envName: LLAMACPP_CPU_REQUEST
    required: true
    default: "200m"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_MEMORY_REQUEST
    required: true
    default: "21Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_CPU_LIMIT
    required: true
    default: "6"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_MEMORY_LIMIT
    required: true
    default: "30Gi"
    type: string
    editable: false
    applyOnChange: false
  - envName: LLAMACPP_REQUIRED_GPU_MEMORY
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "23Gi"
    description: "GPU memory for this preset → nvidia.com/gpumem on NVIDIA."
    regex: "^[0-9]+(Gi|Mi)?$"
