metadata:
  title: Qwen36 Abliterated Claude
  description: "Qwen3.6 35B-A3B abliterated + Claude 4.7 Opus distilled — Q4_K @ 65K, Vision via buun + llm-init"

spec:
  fullDescription: |
    **Model Overview**
    Qwen3.6 35B-A3B with Claude 4.7 Opus reasoning distillation + huihui-ai abliteration (no forced refusals), served via buun llama.cpp with vision (mmproj-gpu-swap). MTP off by default in 1.1.3.

    **Preset Configuration**
    - Model: `huihui-ai/Huihui-Qwen3.6-35B-A3B-Claude-4.7-Opus-abliterated-MTP-GGUF` Q4_K + mmproj F16
    - Capabilities: vision, tools, thinking
    - Engine args: `-c 65536 -ngl 99 --threads 16 -fa on -ctk q8_0 -ctv turbo4 --jinja -np 1 --reasoning off --spec-type draft-mtp --spec-draft-n-max 3 --mmproj-gpu-swap`
    - Required GPU memory: `23Gi`

    **How It Works**
    Model Console (`llm-init`) downloads GGUF + mmproj into shared `appCommon/huggingface`, then buun llama-server serves when ready. OpenAI API on port 8090.

    **Model Storage**
    Shared folder `appCommon/huggingface` mounted as `/cache/hf/hub`.
