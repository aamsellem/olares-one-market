{{- $llamacppclientDomainENV := split "," (.Values.domain.llamacppclient | default "localhost") -}}
{{- $llamacppclientDomain := index $llamacppclientDomainENV "_0" -}}
{{- /* Clone-configurable surface via olaresEnv. llama.cpp loads GGUF from HF cache.
       MODEL_SOURCE drives llm-init download (hf://<repo> --include <file>.gguf).
       For VLM, append a comma-separated mmproj segment in MODEL_SOURCE.
       ENGINE_ARGS is a string of raw llama.cpp flags (wrappers/llamacpp.sh). */ -}}
{{- $oe := .Values.olaresEnv | default dict -}}
{{- $modelSource := $oe.MODEL_SOURCE | default "" -}}
{{- $modelSourceNum := $oe.MODEL_SOURCE_NUM | default "" -}}
{{- $modelSource1 := $oe.MODEL_SOURCE_1 | default "" -}}
{{- $modelSource2 := $oe.MODEL_SOURCE_2 | default "" -}}
{{- $modelSource2Role := $oe.MODEL_SOURCE_2_ROLE | default "" -}}
{{- $modelName := $oe.MODEL_NAME | default "" -}}
{{- $modelMode := $oe.MODEL_MODE | default "" -}}
{{- $supportsGroups := dict
      "vision" "supports_vision"
      "tools" "supports_function_calling,supports_parallel_function_calling,supports_tool_choice"
      "thinking" "supports_reasoning,supports_reasoning_effort"
      "none" ""
      "embedding" "" -}}
{{- $modelSupports := $oe.MODEL_SUPPORTS | default "" -}}
{{- $expandedSupports := list -}}
{{- range $tok := splitList "," $modelSupports -}}
{{- $tok = trim $tok -}}
{{- if $tok -}}
{{- if hasKey $supportsGroups $tok -}}
{{- $mapped := index $supportsGroups $tok -}}
{{- if $mapped -}}
{{- $expandedSupports = append $expandedSupports $mapped -}}
{{- end -}}
{{- else -}}
{{- $expandedSupports = append $expandedSupports $tok -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $modelSupports = join "," $expandedSupports -}}
{{- $gpuType := .Values.gpu | default "" -}}
{{- if not $gpuType -}}
{{- $gpuType = (.Values.GPU | default dict).Type | default "nvidia" -}}
{{- end -}}
{{- $isCpuMode := eq $gpuType "cpu" -}}
{{- $engineArgs := $oe.ENGINE_ARGS | default "" -}}
{{- $engineArgs = include "llamacppqwen36abliteratedone.engineArgs" (dict "Args" $engineArgs "IsCpu" $isCpuMode) -}}
{{- $logLevel := $oe.LOG_LEVEL | default "info" -}}
{{- $hfEndpoint := $oe.HF_ENDPOINT | default "" -}}
{{- $hfToken := $oe.HF_TOKEN | default "" -}}
{{- $runStateHostPath := printf "%s/huggingface/llm-init-run/%s" .Values.userspace.appCommon .Release.Name -}}
---
# llm-init Pod (no GPU). Downloads GGUF models into appCommon/huggingface,
# writes sentinel + model_path, serves progress UI + OpenAI /v1/* proxy on :8090.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llminit
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: llm-init
spec:
  replicas: {{ .Values.workloads.llminit.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: llm-init
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: llm-init
    spec:
      restartPolicy: Always
      volumes:
        - name: hf-cache
          hostPath:
            path: "{{ .Values.userspace.appCommon }}/huggingface"
            type: DirectoryOrCreate
        - name: run-state
          hostPath:
            path: "{{ $runStateHostPath }}"
            type: DirectoryOrCreate
      initContainers:
        - name: init-chown
          image: docker.io/beclab/aboveos-busybox:1.37.0
          command:
            - sh
            - -c
            - "mkdir -p /cache/hf/hub/.locks && chown -R 1000:1000 /cache/hf/hub /run/llm-init || true"
          volumeMounts:
            - name: hf-cache
              mountPath: /cache/hf/hub
            - name: run-state
              mountPath: /run/llm-init
          securityContext:
            runAsUser: 0
      containers:
        - name: llm-init
          image: docker.io/beclab/llm-init:v1.3.1
          imagePullPolicy: IfNotPresent
          env:
            - name: ENGINE_KIND
              value: llamacpp
            - name: MODEL_NAME
              value: "{{ $modelName }}"
{{- if $modelSourceNum }}
            - name: MODEL_SOURCE_NUM
              value: "{{ $modelSourceNum }}"
            - name: MODEL_SOURCE_1
              value: "{{ $modelSource1 }}"
            - name: MODEL_SOURCE_2
              value: "{{ $modelSource2 }}"
            - name: MODEL_SOURCE_2_ROLE
              value: "{{ $modelSource2Role }}"
{{- else }}
            - name: MODEL_SOURCE
              value: "{{ $modelSource }}"
{{- end }}
            - name: MODEL_MODE
              value: "{{ $modelMode }}"
{{- if $modelSupports }}
            - name: MODEL_SUPPORTS
              value: "{{ $modelSupports }}"
{{- end }}
            - name: ENGINE_ARGS
              value: "{{ $engineArgs }}"
{{- if $hfEndpoint }}
            - name: HF_ENDPOINT
              value: "{{ $hfEndpoint }}"
{{- end }}
{{- if $hfToken }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: HF_TOKEN
{{- end }}
            - name: RUN_DIR
              value: /run/llm-init
            - name: PORT
              value: "8090"
            - name: LOG_LEVEL
              value: "{{ $logLevel }}"
            - name: LOG_FORMAT
              value: json
            - name: APP_URL
              value: "https://{{ $llamacppclientDomain }}"
          ports:
            - name: http
              containerPort: 8090
          livenessProbe:
            httpGet:
              path: /livez
              port: 8090
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /livez
              port: 8090
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: hf-cache
              mountPath: /cache/hf/hub
            - name: run-state
              mountPath: /run/llm-init
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: download-svc
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: llm-init
spec:
  selector:
    io.kompose.service: llm-init
  ports:
    - name: http
      port: 8090
      targetPort: 8090
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: sharedentrances-api
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: llm-init
spec:
  selector:
    io.kompose.service: llm-init
  ports:
    - name: http
      port: 80
      targetPort: 8090
  type: ClusterIP
