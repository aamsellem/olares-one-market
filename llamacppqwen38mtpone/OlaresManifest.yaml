spec:
  versionName: 1.0.1
  upgradeDescription: |
    v1.0.1: raise HAMi virtual VRAM cap from 22000m → 24000m. At 22000m the target model + q8_0 KV + 131K context reaches 22340 MiB before the MTP draft context can allocate its 512 MiB KV buffer, causing a CUDA OOM inside common_speculative_init_result and CrashLoopBackOff. 24000m leaves ~576 MiB physical headroom on the 24 GiB 5090M for driver/display. No other runtime flags changed (context, MTP depth, batch size, KV quantization all preserved).

    v1.0.0: initial release. Qwen3.8-27B (dense) via upstream llama.cpp with native MTP speculative decoding. Image `ghcr.io/ggml-org/llama.cpp:server-cuda12-b10666` (pinned) — earliest upstream build confirmed by community to run Qwen3.8-27B MTP on CUDA (ggml-org/llama.cpp#27164 + Habr benchmark). The `server-cuda13` family is blocked on Olares One: nvidia-container-cli rejects it (image declares cuda>=13.3, Olares driver 595.84 = CUDA 13.2) — same server-cuda12 pivot as llamacppqwen36a3bdflashone v1.0.0. Target `unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_XL.gguf` (~17.6 GB). Chat template downloaded once at container start from froggeric/Qwen-Fixed-Chat-Templates pinned @ 855bffc4 (v22.5, explicit Qwen 3.5/3.6/3.8 support) — the GGUF-embedded template is incomplete for tool calling. Config: 131K context (safe default vs native 262K), q8_0/q8_0 KV, MTP n_max=2 starting point, `--reasoning-format deepseek` + `--reasoning-preserve` for tool-calling clients — reasoning stays ON (unlike the qwen36 MTP chart, which runs `--reasoning off`). CUDA_DEVICE_MEMORY_LIMIT_0=22000m (HAMi workaround). On-device bench numbers pending — see PR for validation plan.
  fullDescription: |
    Qwen3.8 27B (dense) with Multi-Token Prediction (MTP) speculative decoding on upstream llama.cpp — no fork, no custom image.
    RTX 5090M (24GB) + 96GB DDR5 + Core Ultra 9 275HX.

    Stack:
      - llama.cpp upstream ghcr.io/ggml-org/llama.cpp:server-cuda12-b10666 (pinned build)
      - --spec-type draft-mtp + --spec-draft-n-max 2 + --cache-type-k/v q8_0 + 131K context
      - Target model: unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_XL.gguf (~17.6 GB, Unsloth Dynamic)
      - Chat template: froggeric/Qwen-Fixed-Chat-Templates @ 855bffc4 (v22.5), fetched at first boot to /config
      - Reasoning ON: --reasoning-format deepseek + --reasoning-preserve (template keeps think blocks across turns)
      - No separate drafter — MTP head is integrated in the GGUF

    Why this matters:
      - Upstream-pure: one docker pull + one HuggingFace download, switches forward with upstream releases
      - MTP speculative decoding for a dense 27B on 24 GB — 131K context with q8_0 KV
      - LM Studio / Open WebUI / Ollama compatible (OpenAI-style API on 8000)

    Performance on Olares One: NOT yet measured — chart ships with conservative starting config
    (MTP n_max=2, 131K ctx). See PR for the on-device validation plan (MTP sweep, context sweep).

    First launch downloads the 17.6 GB GGUF from HuggingFace — needs HF token configured in Olares user env.
    Exposes an OpenAI-compatible API on port 8000.

