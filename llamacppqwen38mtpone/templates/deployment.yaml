---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llamacpp-qwen38-mtp-env
  namespace: "{{ .Release.Namespace }}"
data:
  TARGET_MODEL: "unsloth/Qwen3.8-27B-GGUF"
  TARGET_FILE: "Qwen3.8-27B-UD-Q4_K_XL.gguf"
  MODEL_ALIAS: "qwen3.8-27b"
  CTX_SIZE: "131072"
  THREADS: "16"
  SPEC_DRAFT_N_MAX: "2"
  CHAT_TEMPLATE_URL: "https://huggingface.co/froggeric/Qwen-Fixed-Chat-Templates/resolve/855bffc49448e299789730ff92c9b8d834d6cc14/chat_template.jinja"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: llamacppqwen38mtpone
  name: llamacppqwen38mtpone
  namespace: "{{ .Release.Namespace }}"
  annotations:
    applications.app.bytetrade.io/gpu-inject: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: llamacppqwen38mtpone
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: llamacppqwen38mtpone
    spec:
      initContainers:
        # Fix hostPath perms — /olares/share/ai/model is created uid 1000 mode 755 on fresh
        # Olares installs; non-root appuser in the main image can't write to it.
        # Use docker.io/alpine (trusted registry, allowed runAsUser:0 per Olares OPA policy).
        - name: fix-shared-perms
          image: "docker.io/alpine:3.20"
          command: ["sh", "-c", "mkdir -p /shared-models/llms && chmod -R 777 /shared-models && echo perms-fixed"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: "/shared-models"
              name: shared-models
      containers:
        - name: llamacpp-qwen38-mtp-server
          image: "ghcr.io/ggml-org/llama.cpp:server-cuda12-b10666"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              MODELS_DIR=${MODELS_DIR:-/models}
              SHARED_DIR=${SHARED_DIR:-/shared-models/llms}
              mkdir -p "$MODELS_DIR" "$SHARED_DIR" /config
              # Migrate $TARGET_FILE from old per-app dir to shared if needed
              if [ -f "$MODELS_DIR/$TARGET_FILE" ] && [ ! -f "$SHARED_DIR/$TARGET_FILE.ok" ]; then
                echo "==> Migrating $TARGET_FILE from per-app → shared"
                mv "$MODELS_DIR/$TARGET_FILE" "$SHARED_DIR/$TARGET_FILE"
                [ -f "$MODELS_DIR/$TARGET_FILE.ok" ] && mv "$MODELS_DIR/$TARGET_FILE.ok" "$SHARED_DIR/$TARGET_FILE.ok" || touch "$SHARED_DIR/$TARGET_FILE.ok"
              fi
              HF_AUTH=""
              if [ -n "$HF_TOKEN" ]; then HF_AUTH="-H \"Authorization: Bearer $HF_TOKEN\""; fi
              if [ ! -f "$SHARED_DIR/$TARGET_FILE.ok" ]; then
                echo "==> Downloading $TARGET_MODEL/$TARGET_FILE (~17.6 GB)"
                eval curl -fL -C - --retry 20 --retry-delay 15 --retry-all-errors --connect-timeout 30 $HF_AUTH \
                  "https://huggingface.co/${TARGET_MODEL}/resolve/main/${TARGET_FILE}" \
                  -o "$SHARED_DIR/$TARGET_FILE"
                touch "$SHARED_DIR/$TARGET_FILE.ok"
              fi
              # Pinned chat template (froggeric v22.5, Qwen 3.5/3.6/3.8) — GGUF-embedded
              # template is incomplete for tool calling. Fetch once, verify size, keep in /config.
              if [ ! -f /config/chat_template.jinja.ok ]; then
                echo "==> Downloading pinned chat template"
                eval curl -fL --retry 20 --retry-delay 15 --retry-all-errors --connect-timeout 30 $HF_AUTH \
                  "$CHAT_TEMPLATE_URL" \
                  -o /config/chat_template.jinja
                touch /config/chat_template.jinja.ok
              fi
              exec /app/llama-server \
                --model "$SHARED_DIR/$TARGET_FILE" \
                --alias "$MODEL_ALIAS" \
                --host 0.0.0.0 --port 8000 \
                --n-gpu-layers 99 \
                --ctx-size "${CTX_SIZE:-131072}" \
                --threads "${THREADS:-16}" \
                --threads-batch "${THREADS:-16}" \
                --cache-type-k q8_0 --cache-type-v q8_0 \
                --batch-size 2048 --ubatch-size 512 \
                --parallel 1 \
                --flash-attn on --jinja \
                --chat-template-file /config/chat_template.jinja \
                --reasoning-format deepseek \
                --reasoning-preserve \
                --spec-type draft-mtp \
                --spec-draft-n-max "${SPEC_DRAFT_N_MAX:-2}"
          envFrom:
            - configMapRef:
                name: llamacpp-qwen38-mtp-env
          env:
            - name: HF_HOME
              value: "/models/huggingface"
            - name: HF_TOKEN
              value: "{{ .Values.olaresEnv.OLARES_USER_HUGGINGFACE_TOKEN }}"
            - name: MODELS_DIR
              value: "/models"
            # HAMi virtual VRAM cap. 24000m leaves ~500 MiB headroom under the physical
            # 24 GiB (24576 MiB) 5090M so the driver/display can allocate without contention.
            # At 22000m the Qwen3.8-27B UD-Q4_K_XL + q8_0 KV + 131K ctx + MTP draft context
            # OOMs at the 512 MiB MTP KV allocation (target-model reaches 22340 MiB before
            # the MTP context needs its buffer). See on-device log 2026-09-06.
            - name: CUDA_DEVICE_MEMORY_LIMIT_0
              value: "24000m"
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 600
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 720
          resources:
            limits:
              cpu: "16"
              memory: 40Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: 4000m
              memory: 24Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - mountPath: "/models"
              name: models
            - mountPath: "/shared-models"
              name: shared-models
            - mountPath: "/config"
              name: config
      volumes:
        - name: models
          hostPath:
            path: "{{ .Values.userspace.appData }}/models"
            type: DirectoryOrCreate
        - name: shared-models
          hostPath:
            path: "/olares/share/ai/model"
            type: DirectoryOrCreate
        - name: config
          emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: llamacppqwen38mtpone
  name: llamacppqwen38mtpone
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "llamacpp-mtp"
      port: 8000
      targetPort: 8000
  selector:
    io.kompose.service: llamacppqwen38mtpone
