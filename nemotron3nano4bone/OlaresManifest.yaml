---
olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'
workloadReplicas:
  nemotron3nano4bone: 1
metadata:
  name: nemotron3nano4bone
  icon: https://orales-one-market.aamsellem.workers.dev/icons/nemotron3nano4bone.png
  description: "Nemotron 3 Nano 4B Q8 via llama.cpp — fast edge AI, optimized for Olares One"
  title: Nemotron 3 Nano 4B One
  version: '1.0.8'
  categories:
    - AI
  bento:
    family: nemotron
    size_label: "4B"
    badge: nano
    hero:
      value: "145 t/s"
      label: "speed"
    specs:
      - { label: "context", value: "128K" }
      - { label: "vram", value: "5 GB" }
    capabilities:
      tool_calling: true
      vision:       false
      audio:        false
      mtp:          { enabled: false }
    stack: "llama.cpp b11046 · CUDA 13.3 · Q8_0"
entrances:
  - name: nemotron3nano4bone
    port: 8080
    host: nemotron3nano4bone
    title: Nemotron Nano 4B One
    icon: https://orales-one-market.aamsellem.workers.dev/icons/nemotron3nano4bone.png
    openMethod: window
    authLevel: internal
spec:
  versionName: '1.0.7'
  upgradeDescription: |
    v1.0.7: **CUDA 13.3 image, +5% decode.** Switched from `ghcr.io/ggml-org/llama.cpp:server-cuda13-b8740` to `docker.io/beclab/ggml-org-llama.cpp:server-cuda13-b11046` (CUDA 13.3 runtime via the bundled forward-compat libcuda, runs on the Olares 595.84 / CUDA 13.2 driver). `--mlock` became `--load-mode mmap+mlock` (the flag was merged upstream). Bench on Olares One 2026-09-30, same args, only the image changed (Nemotron-3-Nano-4B Q8_0): Space Invaders HTML 138.55 → **145.03 t/s**, code prompt 137.94 → **142.94 t/s**.
  fullDescription: |
    NVIDIA Nemotron 3 Nano 4B (hybrid Mamba-2 + Transformer) served via llama.cpp — optimized for Olares One.
    Ultra-fast 4B parameter model with reasoning support (think tokens).
    Q8_0 quantization (4.2GB) — fits entirely in GPU with 20GB free for 128K+ context.
    Hybrid architecture: Mamba-2 layers + 4 attention layers for efficient long-context inference.
    Compressed from Nemotron-Nano-9B-v2, designed for edge/agentic AI.
    llama.cpp b8369 with flash attention and CUDA graph optimization.
    Downloads the GGUF model on first launch (~4.2GB) and caches it.
    Exposes an OpenAI-compatible API on port 8080.

  developer: aamsellem
  website: https://github.com/aamsellem/olares-one-market
  sourceCode: https://github.com/aamsellem/olares-one-market
  submitter: aamsellem
  locale:
    - en-US
  license:
    - text: NVIDIA Open Model License
      url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Nano-4B-BF16/blob/main/LICENSE

  accelerator:
    - mode: nvidia
      limitedCpu: 8
      requiredCpu: 2
      requiredDisk: 10Gi
      limitedDisk: 20Gi
      limitedMemory: 16Gi
      requiredMemory: 8Gi
      requiredGPUMemory: 1Gi
      limitedGPUMemory: 24Gi

  supportArch:
    - amd64
permission:
  appData: true
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
