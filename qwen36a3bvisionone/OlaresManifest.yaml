---
olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  qwen36a3bvisionone: 1

metadata:
  name: qwen36a3bvisionone
  icon: https://orales-one-market.aamsellem.workers.dev/icons/qwen36a3bvisionone.png
  description: "Qwen3.6 35B-A3B Vision via llama.cpp — image + text, optimized for Olares One"
  appid: qwen36a3bvisionone
  title: Qwen3.6 Vision (Olares One)
  version: '1.1.1'
  categories:
    - Vision
    - AI Agents
entrances:
  - name: qwen36a3bvisionone
    port: 8080
    host: qwen36a3bvisionone
    title: Qwen 36B Vision One
    icon: https://orales-one-market.aamsellem.workers.dev/icons/qwen36a3bvisionone.png
    openMethod: window
    authLevel: internal
spec:
  versionName: '1.1.1'
  upgradeDescription: |
    v1.1.1: **Olares 1.12.6+ compatibility: manifest migrated to apiVersion v3.** Olares 1.12.6 deprecated apiVersion v2 apps: installed v2 versions keep running but can no longer be upgraded ("This app version has been deprecated and cannot be upgraded") or installed. If you run a previous version, **uninstall it and install 1.1.1**; model files in the shared model folder are kept. No change to the inference stack. Requires Olares >= 1.12.6.

    v1.0.2: force re-sync after chart-repo timeout on v1.0.0. No functional change.
  fullDescription: |
    Qwen3.6 35B-A3B Vision (MoE, 3B active) served via llama.cpp — optimized for Olares One.
    Multimodal: accepts images via OpenAI-compatible vision API (image_url format).
    RTX 5090M (24GB) + 96GB DDR5 + Core Ultra 9 275HX.
    Unsloth Dynamic Q4_K_XL quantization (22.4GB) + mmproj F16 (0.9GB).
    Flash attention, CUDA graph optimization, and op-offload enabled.
    llama.cpp b8740 with multimodal projector support + Hadamard rotation KV cache.
    Downloads the GGUF model (~22GB) and mmproj (~0.9GB) on first launch.
    Context 32K (fits model + mmproj + KV q4_0 in 24GB VRAM).
    Exposes an OpenAI-compatible API on port 8080.

  developer: aamsellem
  website: https://github.com/aamsellem/olares-one-market
  sourceCode: https://github.com/aamsellem/olares-one-market
  submitter: aamsellem
  locale:
    - en-US
  license:
    - text: Apache-2.0
      url: https://huggingface.co/Qwen/Qwen3.6-35B-A3B/blob/main/LICENSE


  supportArch:
    - amd64
  accelerator:
    - mode: nvidia
      supportMultiCard: false
      supportMultiNodes: false
      requiredCpu: "4"
      limitedCpu: "16"
      requiredMemory: 24Gi
      limitedMemory: 40Gi
      requiredDisk: 35Gi
      limitedDisk: 50Gi
      requiredGPUMemory: 23Gi
      limitedGPUMemory: 23Gi
permission:
  appData: true
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
