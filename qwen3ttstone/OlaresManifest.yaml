---
olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  qwen3ttstone: 1

metadata:
  name: qwen3ttstone
  icon: https://orales-one-market.aamsellem.workers.dev/icons/qwen3ttstone.png
  description: "Qwen3-TTS 1.7B — text-to-speech with voice cloning, optimized for Olares One"
  appid: qwen3ttstone
  title: Qwen3-TTS 1.7B (Olares One)
  version: '1.1.0'
  categories:
    - TTS
entrances:
  - name: qwen3ttstone
    port: 8000
    host: qwen3ttstone
    title: Qwen3-TTS One
    icon: https://orales-one-market.aamsellem.workers.dev/icons/qwen3ttstone.png
    openMethod: window
    authLevel: internal
spec:
  versionName: '1.1.0'
  upgradeDescription: |
    v1.1.0: **Olares 1.12.6+ compatibility: manifest migrated to apiVersion v3.** Olares 1.12.6 deprecated apiVersion v2 apps: installed v2 versions keep running but can no longer be upgraded ("This app version has been deprecated and cannot be upgraded") or installed. If you run a previous version, **uninstall it and install 1.1.0**; model files in the shared model folder are kept. No change to the inference stack. Requires Olares >= 1.12.6.

  fullDescription: |
    Qwen3-TTS 1.7B CustomVoice served via Gradio — optimized for Olares One.
    RTX 5090M (24GB) + 96GB DDR5 + Core Ultra 9 275HX.
    9 built-in premium voices with instruction control.
    Zero-shot voice cloning from 3 seconds of reference audio.
    10 languages: French, English, Chinese, Japanese, Korean, German, Russian, Portuguese, Spanish, Italian.
    Downloads the model on first launch (~4.5GB) and caches it.
    Exposes a Gradio web UI on port 8000.

  developer: aamsellem
  website: https://github.com/QwenLM/Qwen3-TTS
  sourceCode: https://github.com/QwenLM/Qwen3-TTS
  submitter: aamsellem
  locale:
    - en-US
  license:
    - text: Apache-2.0
      url: https://github.com/QwenLM/Qwen3-TTS/blob/main/LICENSE


  supportArch:
    - amd64
  accelerator:
    - mode: nvidia
      supportMultiCard: false
      supportMultiNodes: false
      requiredCpu: "4"
      limitedCpu: "8"
      requiredMemory: 8Gi
      limitedMemory: 16Gi
      requiredDisk: 15Gi
      limitedDisk: 30Gi
      requiredGPUMemory: 8Gi
      limitedGPUMemory: 8Gi
permission:
  appData: true
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
