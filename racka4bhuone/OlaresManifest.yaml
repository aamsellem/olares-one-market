spec:
  versionName: 1.0.3
  upgradeDescription: |
    v1.0.2: **slow-connection + diagnostics fix** (Discord bug report 2026-06-03). User reported install crash-looping at startup-probe 503 after 20 min — root cause: HF_TOKEN missing/invalid AND slow HF download exceeding the previous 20-min probe budget. Four fixes: (1) startup-probe failureThreshold 80 → 720 = 6h budget for slow networks, (2) liveness initialDelay 5min → 10min, (3) on missing HF_TOKEN the container now blocks indefinitely with a clear error + recovery steps logged every 5 min (no more exit-1 crash loop, so `kubectl logs` shows what's wrong), (4) post-download size check: if file < 4 GB (HF returned 401/403 HTML disguised as a file), delete + log clear error instead of marking `.ok`. Model still cached at `/olares/share/ai/model/llms/` (unchanged from v1.0.0).

    v1.0.1: **bench validated on Olares One** — 133.6 t/s avg across 3 Hungarian prompts (Budapest poem 134.85, quantum physics 133.24, paprikás csirke vs pörkölt 132.73). 3/3 finish_reason=stop, no garbage, fluent Hungarian across creative + technical + culinary domains. Prompt processing ~1700 t/s. Added "Special Request" category — this app was added on user request from the Olares community.

    v1.0.0: initial release. **Racka 4B** by ELTE NLP (Eötvös Loránd University, Budapest) — the first serious Hungarian language model. Built on a Qwen3-4B backbone, post-trained on **160B tokens (44% Hungarian, the rest German + English)**. Released February 2026.

    Why it matters: Hungarian has very limited LLM coverage. General-purpose models do English/German fluently but struggle with Hungarian morphology, idioms, and agglutinative structure. Racka-4B is specifically optimized for Hungarian generation, reasoning, and translation.

    **Quant**: Q8_0 (4.28 GB) — lossless quality on a 4B model, no reason to compress further given Olares One's 24 GB VRAM headroom.

    Stack:
    - `elte-nlp/Racka-4B-GGUF` Q8_0 (4.28 GB) via llama.cpp upstream `server-cuda13-b8740`
    - 32K context, full GPU offload, flash attention, jinja templates
    - OpenAI-compatible API on port 8080

    **⚠️ Access**: this is a **gated HuggingFace repo** (CC-BY-NC-SA-4.0 license). Before installing:
    1. Open the model card: https://huggingface.co/elte-nlp/Racka-4B-GGUF
    2. Accept the license terms (button on HF page)
    3. Make sure your HF token is configured in Olares settings (Settings → Integrations → HuggingFace)
    4. Install this app — it will download the 4.28 GB GGUF on first launch (~2-5 min)

    Use cases:
    - Hungarian language conversation, writing, summarization
    - Bilingual translation (HU ↔ EN ↔ DE)
    - Local document Q&A in Hungarian
    - Anything where you need fluent Hungarian output that general models can't deliver

    **NOT for commercial use** — CC-BY-NC-SA license prohibits commercial deployment.

  fullDescription: |
    Racka 4B is the first serious open Hungarian language model, released by the NLP group at Eötvös Loránd University (ELTE) in Budapest. Built on Alibaba's Qwen3-4B as the architecture backbone, then post-trained on 160 billion tokens with a deliberate language mix: 44% Hungarian, the rest split between German and English to preserve cross-lingual reasoning.

    Performance highlights (per ELTE's announcement):
    - Outperforms Qwen3-4B base on Hungarian benchmarks by a wide margin
    - Comparable or better than much larger models (8-12B) on Hungarian-specific tasks
    - Retains strong English/German capabilities thanks to the language mix
    - Reasoning mode preserved (Qwen3-style think/no-think toggle)

    Stack:
    - Image: `ghcr.io/ggml-org/llama.cpp:server-cuda13-b8740`
    - Model: `elte-nlp/Racka-4B-GGUF` Q8_0 (4.28 GB)
    - 32K context, full GPU layers, flash attention on
    - OpenAI-compatible API at port 8080

    First launch downloads ~4.3 GB from HuggingFace (gated repo, requires HF token).

