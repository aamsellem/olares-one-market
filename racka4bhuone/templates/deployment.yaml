---
apiVersion: v1
kind: ConfigMap
metadata:
  name: racka4b-env
  namespace: "{{ .Release.Namespace }}"
data:
  TARGET_MODEL: "elte-nlp/Racka-4B-GGUF"
  TARGET_FILE: "Racka-4B-Q8_0.gguf"
  MODEL_ALIAS: "racka-4b"
  CTX_SIZE: "32768"
  THREADS: "16"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: racka4bhuone
  name: racka4bhuone
  namespace: "{{ .Release.Namespace }}"
  annotations:
    applications.app.bytetrade.io/gpu-inject: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: racka4bhuone
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: racka4bhuone
    spec:
      containers:
        - name: racka-server
          image: "ghcr.io/ggml-org/llama.cpp:server-cuda13-b8740"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              MODELS_DIR=${MODELS_DIR:-/models}
              SHARED_DIR=${SHARED_DIR:-/shared-models/llms}
              mkdir -p "$MODELS_DIR" "$SHARED_DIR"
              if [ -z "$HF_TOKEN" ]; then
                echo "==================================================================="
                echo "==> ERROR: HF_TOKEN is empty. Racka-4B is a gated HuggingFace repo."
                echo "==> 1) Accept license: https://huggingface.co/elte-nlp/Racka-4B-GGUF"
                echo "==> 2) Set HF token in Olares Settings → Integrations → HuggingFace"
                echo "==> 3) Uninstall + reinstall this app (so app-service re-reads the env)"
                echo "==================================================================="
                while true; do sleep 300; echo "(still waiting for HF_TOKEN — see log header above)"; done
              fi
              # Migrate $TARGET_FILE from old per-app dir to shared if needed
              if [ -f "$MODELS_DIR/$TARGET_FILE" ] && [ ! -f "$SHARED_DIR/$TARGET_FILE.ok" ]; then
                echo "==> Migrating $TARGET_FILE from per-app → shared"
                mv "$MODELS_DIR/$TARGET_FILE" "$SHARED_DIR/$TARGET_FILE"
                touch "$SHARED_DIR/$TARGET_FILE.ok"
              fi
              if [ ! -f "$SHARED_DIR/$TARGET_FILE.ok" ]; then
                echo "==> Downloading $TARGET_MODEL/$TARGET_FILE (~4.3 GB, gated repo)"
                echo "==> Source: https://huggingface.co/${TARGET_MODEL}/resolve/main/${TARGET_FILE}"
                echo "==> Target: $SHARED_DIR/$TARGET_FILE"
                echo "==> If this hangs on a slow connection, that's normal — curl will retry up to 20 times with resume."
                curl -fL -C - --retry 20 --retry-delay 15 --retry-all-errors --connect-timeout 30 --progress-bar \
                  -H "Authorization: Bearer $HF_TOKEN" \
                  "https://huggingface.co/${TARGET_MODEL}/resolve/main/${TARGET_FILE}" \
                  -o "$SHARED_DIR/$TARGET_FILE"
                DL_SIZE=$(stat -c%s "$SHARED_DIR/$TARGET_FILE" 2>/dev/null || stat -f%z "$SHARED_DIR/$TARGET_FILE")
                if [ "$DL_SIZE" -lt 4000000000 ]; then
                  echo "==> ERROR: Downloaded file is too small ($DL_SIZE bytes < 4 GB expected). Likely HF_TOKEN invalid or gated repo not accepted."
                  rm -f "$SHARED_DIR/$TARGET_FILE"
                  while true; do sleep 300; echo "(download truncated — re-check HF_TOKEN + license acceptance, then uninstall+reinstall)"; done
                fi
                touch "$SHARED_DIR/$TARGET_FILE.ok"
                echo "==> Download complete: $(du -h $SHARED_DIR/$TARGET_FILE | cut -f1)"
              fi
              exec /app/llama-server \
                --model "$SHARED_DIR/$TARGET_FILE" \
                --alias "$MODEL_ALIAS" \
                --host 0.0.0.0 --port 8080 \
                --n-gpu-layers 99 \
                --ctx-size "${CTX_SIZE:-32768}" \
                --threads "${THREADS:-16}" \
                --cache-type-k q8_0 --cache-type-v q8_0 \
                --batch-size 512 --ubatch-size 512 \
                --parallel 1 \
                --flash-attn on --jinja \
                --reasoning off
          envFrom:
            - configMapRef:
                name: racka4b-env
          env:
            - name: HF_HOME
              value: "/models/huggingface"
            - name: HF_TOKEN
              value: "{{ .Values.olaresEnv.OLARES_USER_HUGGINGFACE_TOKEN }}"
            - name: MODELS_DIR
              value: "/models"
            - name: CUDA_DEVICE_MEMORY_LIMIT_0
              value: "8000m"
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 600
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          startupProbe:
            # 6h budget: 60s + 720 × 30s = 6h. Slow HF downloads on bad networks
            # can take >1h for 4.3 GB; curl auto-retries with resume.
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 720
          resources:
            limits:
              cpu: "8"
              memory: 16Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: 2000m
              memory: 6Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - mountPath: "/models"
              name: models
            - mountPath: "/shared-models"
              name: shared-models
      volumes:
        - name: models
          hostPath:
            path: "{{ .Values.userspace.appData }}/models"
            type: DirectoryOrCreate
        - name: shared-models
          hostPath:
            path: "/olares/share/ai/model"
            type: Directory
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: racka4bhuone
  name: racka4bhuone
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "racka"
      port: 8080
      targetPort: 8080
  selector:
    io.kompose.service: racka4bhuone
