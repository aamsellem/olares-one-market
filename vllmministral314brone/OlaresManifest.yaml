---
olaresManifest.version: '0.10.0'
olaresManifest.type: app
apiVersion: 'v2'
metadata:
  name: vllmministral314brone
  icon: https://docs.vllm.ai/en/latest/_images/vllm-logo-text-light.png
  description: "Ministral 3 14B Reasoning AWQ served via vLLM"
  appid: vllmministral314brone
  title: Ministral 3 14B Reasoning AWQ (vLLM)
  version: '1.0.0'
  categories:
    - AI
sharedEntrances:
  - name: vllmministral314brone
    host: sharedentrances-vllm
    port: 0
    title: Ministral 3 14B Reasoning AWQ (vLLM)
    invisible: true
    authLevel: internal
    icon: https://docs.vllm.ai/en/latest/_images/vllm-logo-text-light.png
entrances:
  - name: vllmministral314broneclient
    port: 8080
    host: vllmministral314broneclient
    title: Ministral 3 14B Reasoning AWQ (vLLM)
    icon: https://docs.vllm.ai/en/latest/_images/vllm-logo-text-light.png
    openMethod: window
    authLevel: internal
spec:
  versionName: '1.0.0'
  fullDescription: |
    ## IMPORTANT NOTE ##
    This is a shared app. Once installed by the Olares Admin, all users in the cluster can use it through reference app.

    ## MODEL ##
    Ministral 3 14B Reasoning AWQ served via vLLM.
    Auto-registers with LiteLLM Gateway if installed.

  developer: vLLM Team
  website: https://vllm.ai/
  submitter: orales-market
  locale:
    - en-US
  license:
    - text: Apache-2.0
      url: https://github.com/vllm-project/vllm/blob/main/LICENSE

  {{- if and .Values.admin .Values.bfl.username (eq .Values.admin .Values.bfl.username) }}
  limitedCpu: 8000m
  requiredCpu: 1000m
  requiredDisk: 30Gi
  limitedDisk: 30Gi
  limitedMemory: 32Gi
  requiredMemory: 4Gi
  requiredGpu: 1Gi
  limitedGpu: 20Gi
  {{- else }}
  requiredMemory: 64Mi
  limitedMemory: 800Mi
  requiredDisk: 50Mi
  limitedDisk: 200Mi
  requiredCpu: 10m
  limitedCpu: 800m
  {{- end }}

  supportArch:
    - amd64

  subCharts:
  - name: vllmministral314broneserver
    shared: true
  - name: vllmministral314brone
permission:
  appData: true
  appCache: true
  userData:
    - Home/VLLM
options:
  apiTimeout: 0
  appScope:
  {{- if and .Values.admin .Values.bfl.username (eq .Values.admin .Values.bfl.username) }}
    clusterScoped: true
    appRef:
      - vllmministral314brone
  {{- else }}
    clusterScoped: false
  {{- end }}
  dependencies:
    - name: olares
      version: '>=1.12.3-0'
      type: system
  {{- if and .Values.admin .Values.bfl.username (eq .Values.admin .Values.bfl.username) }}
    - name: litellmgateway
      type: application
      version: '>=1.0.0'
      mandatory: false
  {{- else }}
    - name: vllmministral314brone
      type: application
      version: '>=1.0.0'
      mandatory: true
  {{- end }}
