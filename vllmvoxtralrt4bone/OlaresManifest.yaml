---
olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  vllmvoxtralrt4bone: 1

metadata:
  name: vllmvoxtralrt4bone
  icon: https://orales-one-market.aamsellem.workers.dev/icons/vllmvoxtralrt4bone.png
  description: "Voxtral Realtime 4B streaming ASR via vLLM — real-time speech transcription, optimized for Olares One"
  appid: vllmvoxtralrt4bone
  title: Voxtral Realtime 4B One
  version: '1.1.1'
  categories:
    - Audio
entrances:
  - name: vllmvoxtralrt4bone
    port: 8000
    host: vllmvoxtralrt4bone
    title: Voxtral RT 4B One
    icon: https://orales-one-market.aamsellem.workers.dev/icons/vllmvoxtralrt4bone.png
    openMethod: window
    authLevel: internal
spec:
  versionName: '1.1.1'
  upgradeDescription: |
    v1.1.1: **Olares 1.12.6+ compatibility: manifest migrated to apiVersion v3.** Olares 1.12.6 deprecated apiVersion v2 apps: installed v2 versions keep running but can no longer be upgraded ("This app version has been deprecated and cannot be upgraded") or installed. If you run a previous version, **uninstall it and install 1.1.1**; model files in the shared model folder are kept. No change to the inference stack. Requires Olares >= 1.12.6.

  fullDescription: |
    Mistral Voxtral Mini 4B Realtime (streaming ASR) served via vLLM — optimized for Olares One.
    RTX 5090M (24GB) + 96GB DDR5 + Core Ultra 9 275HX.
    BF16 precision (~16GB VRAM). Streaming WebSocket endpoint /v1/realtime.
    Causal audio encoder for infinite-length real-time transcription.
    Configurable latency (80ms-2400ms). 13 languages. 8.7% FLEURS WER.
    PIECEWISE cudagraph compilation for optimized inference.
    Apache 2.0 license.
    Downloads model on first launch (~9GB) and caches it.
    Exposes WebSocket /v1/realtime + OpenAI-compatible API on port 8000.

  developer: aamsellem
  website: https://github.com/aamsellem/olares-one-market
  sourceCode: https://github.com/aamsellem/olares-one-market
  submitter: aamsellem
  locale:
    - en-US
  license:
    - text: Apache 2.0
      url: https://www.apache.org/licenses/LICENSE-2.0


  supportArch:
    - amd64
  accelerator:
    - mode: nvidia
      supportMultiCard: false
      supportMultiNodes: false
      requiredCpu: "4"
      limitedCpu: "16"
      requiredMemory: 4Gi
      limitedMemory: 40Gi
      requiredDisk: 20Gi
      limitedDisk: 30Gi
      requiredGPUMemory: 23Gi
      limitedGPUMemory: 23Gi
permission:
  appData: true
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
