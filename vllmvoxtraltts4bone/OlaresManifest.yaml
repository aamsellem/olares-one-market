---
olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  vllmvoxtraltts4bone: 1

metadata:
  name: vllmvoxtraltts4bone
  icon: https://orales-one-market.aamsellem.workers.dev/icons/vllmvoxtraltts4bone.png
  description: "Voxtral 4B TTS via vLLM-Omni — text-to-speech with 20 voices, optimized for Olares One"
  appid: vllmvoxtraltts4bone
  title: Voxtral 4B TTS One
  version: '1.1.1'
  categories:
    - TTS
entrances:
  - name: vllmvoxtraltts4bone
    port: 8000
    host: vllmvoxtraltts4bone
    title: Voxtral TTS 4B One
    icon: https://orales-one-market.aamsellem.workers.dev/icons/vllmvoxtraltts4bone.png
    openMethod: window
    authLevel: internal
spec:
  versionName: '1.1.1'
  upgradeDescription: |
    v1.1.1: **Olares 1.12.6+ compatibility: manifest migrated to apiVersion v3.** Olares 1.12.6 deprecated apiVersion v2 apps: installed v2 versions keep running but can no longer be upgraded ("This app version has been deprecated and cannot be upgraded") or installed. If you run a previous version, **uninstall it and install 1.1.1**; model files in the shared model folder are kept. No change to the inference stack. Requires Olares >= 1.12.6.

  fullDescription: |
    Mistral Voxtral 4B TTS served via vLLM-Omni — optimized for Olares One.
    RTX 5090M (24GB) + 96GB DDR5 + Core Ultra 9 275HX.
    BF16 precision (~8GB VRAM). 24 kHz audio output. 70ms latency.
    20 preset voices (10 languages: EN, FR, ES, DE, IT, PT, NL, AR, HI).
    OpenAI-compatible /v1/audio/speech endpoint.
    68.4% win rate vs ElevenLabs Flash v2.5 in human preference tests.
    CC BY-NC 4.0 license (non-commercial use).
    Downloads model on first launch (~8GB) and caches it.
    Exposes an OpenAI-compatible API on port 8000.

  developer: aamsellem
  website: https://github.com/aamsellem/olares-one-market
  sourceCode: https://github.com/aamsellem/olares-one-market
  submitter: aamsellem
  locale:
    - en-US
  license:
    - text: CC BY-NC 4.0
      url: https://creativecommons.org/licenses/by-nc/4.0/


  supportArch:
    - amd64
  accelerator:
    - mode: nvidia
      supportMultiCard: false
      supportMultiNodes: false
      requiredCpu: "4"
      limitedCpu: "16"
      requiredMemory: 4Gi
      limitedMemory: 40Gi
      requiredDisk: 20Gi
      limitedDisk: 30Gi
      requiredGPUMemory: 23Gi
      limitedGPUMemory: 23Gi
permission:
  appData: true
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
